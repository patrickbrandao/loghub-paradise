# Fragmento compartilhado: o servico-base `gelf-pg-base`, que o docker-compose.yml
# herda via `extends`. NAO suba este arquivo sozinho.
#
# Fica aqui o que nao depende do destino; o que e' do PostgreSQL (conexao,
# workers, pool), as portas publicadas, o volume /data e o hostname ficam no
# docker-compose.yml.
#
# Regra de heranca do Compose: `environment` e `healthcheck` sao mapas e o filho
# sobrescreve chave a chave; `ports` e' sequencia e concatena (por isso as portas
# ficam so' no filho); `volumes` junta por destino (o de config fica aqui, o
# /data no filho); `depends_on` NAO e' herdado por `extends`.
#
# Config em dois lugares, de proposito (SPEC §16.1, §16.3):
#   - env (aqui e no docker-compose.yml): SO' chaves que exigem restart. Env
#     vence o INI e nao muda num container de pe'.
#   - conf/gelf.ini, montado em /etc/gelf: SO' as recarregaveis (log.level,
#     log.access, log.access_sample). Edite o arquivo e mande
#     `docker kill -s HUP gelf-pg`.

services:
  gelf-pg-base:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VERSION: ${GELF_VERSION:-dev}
        COMMIT: ${GELF_COMMIT:-none}
        GO_VERSION: ${GELF_GO_VERSION:-1.25}
        ALPINE_VERSION: ${GELF_ALPINE_VERSION:-3.22}
    image: ${GELF_IMAGE:-tmsoftbrasil/go-gelf-pg-server}:${GELF_IMAGE_TAG:-dev}

    restart: unless-stopped

    # Precisa ser maior que shutdown.pre_stop_delay + shutdown.drain_timeout,
    # ou o Docker mata o processo no meio do dreno do ring (SPEC §13.4) -- e o
    # que sobra nem chega ao dump de emergencia.
    stop_grace_period: 45s
    stop_signal: SIGTERM

    environment:
      # --- identidade LogHub (go-loghub-ident, SPEC §13.1) ------------------
      # DATADIR e AGENT_NAME ja' vem da imagem. WORKSPACE e' o TENANT, nao o
      # ambiente: prod e staging nao sao tenants. Ele vira o `space` de todo
      # envelope (a coluna space da loghub.inbox). HOSTNAME vem do `hostname:`
      # do servico. AGENT_UUID e MACHINE_ID sao gerados e persistidos em /data
      # na primeira subida.
      # Lido de GELF_WORKSPACE, nunca de WORKSPACE: o shell de CI (Jenkins)
      # exporta WORKSPACE com o caminho do job, e o compose o interpolaria.
      WORKSPACE: ${GELF_WORKSPACE:-default}

      # --- transportes -------------------------------------------------------
      # As portas GELF (SPEC §4.1): 12201 para UDP e TCP, 12202 para HTTP.
      # 0.0.0.0 e' o que recebe as portas publicadas. Nao ha TLS nem HTTPS
      # (SPEC §1.2): quem precisa de GELF cifrado poe um terminador na frente,
      # com PROXY protocol para manter o src-ip.
      GELF_LISTEN_UDP: 0.0.0.0:12201
      GELF_LISTEN_TCP: 0.0.0.0:12201
      GELF_LISTEN_HTTP: 0.0.0.0:12202
      GELF_LISTEN_UDP_LISTENERS: ${GELF_LISTEN_UDP_LISTENERS:-1}
      # O parametro mais importante do UDP. O teto real e' net.core.rmem_max do
      # HOST; o valor efetivo aparece em gelf_udp_read_buffer_bytes.
      GELF_LISTEN_UDP_READ_BUFFER: ${GELF_LISTEN_UDP_READ_BUFFER:-8MiB}
      # Teto da remontagem de chunks UDP (SPEC §5.2).
      GELF_LISTEN_UDP_REASSEMBLY_MAX_BYTES: ${GELF_LISTEN_UDP_REASSEMBLY_MAX_BYTES:-64MiB}
      # PROXY protocol (SPEC §4.6), no TCP e no HTTP: so' com um balanceador na
      # frente. X-Forwarded-For nunca e' lido.
      GELF_PROXY_PROTOCOL: ${GELF_PROXY_PROTOCOL:-off}
      GELF_PROXY_TRUSTED: ${GELF_PROXY_TRUSTED:-127.0.0.1/32,::1/128}

      GELF_ADMIN_ENABLED: "true"
      GELF_ADMIN_BIND: 0.0.0.0:9104

      # --- conversao (SPEC §6; exigem restart) -------------------------------
      # Um dump de emergencia ja' guarda o JLH pronto e volta sem conversao:
      # trocar estas chaves entre duas subidas nao muda um dump pendente
      # (SPEC §3.5, §12.2).
      GELF_CONVERT_MAX_MESSAGE_BYTES: ${GELF_CONVERT_MAX_MESSAGE_BYTES:-128KiB}
      GELF_CONVERT_KEEP_RAW: ${GELF_CONVERT_KEEP_RAW:-malformed}
      GELF_CONVERT_ACCEPT_MALFORMED: ${GELF_CONVERT_ACCEPT_MALFORMED:-true}

      # --- chaves recarregaveis: conf/gelf.ini ---------------------------------
      # log.level, log.access e log.access_sample NAO entram no env: env vence o
      # INI e nunca muda num container de pe', e o `docker kill -s HUP` nao
      # mudaria nada. Edite conf/gelf.ini e mande o HUP. O caminho e' fixo; a
      # pasta vem do volume abaixo.
      GELF_CONFIG: /etc/gelf/gelf.ini

      # --- observabilidade -----------------------------------------------------
      GELF_LOG_FORMAT: ${GELF_LOG_FORMAT:-json}

      # --- desligamento --------------------------------------------------------
      GELF_SHUTDOWN_PRE_STOP_DELAY: ${GELF_SHUTDOWN_PRE_STOP_DELAY:-0s}
      GELF_SHUTDOWN_DRAIN_TIMEOUT: ${GELF_SHUTDOWN_DRAIN_TIMEOUT:-30s}

      # --- memoria (SPEC §15.4) ------------------------------------------------
      # Sem GOMEMLIMIT o GC nao sabe do teto do container e o OOM killer chega
      # antes. Precisa cobrir 2 x ring.max_bytes; o limite do container fica
      # ACIMA dele.
      GOMEMLIMIT: ${GELF_GOMEMLIMIT:-512MiB}

    # /healthz e' liveness pura: 200 enquanto o processo vive. /readyz NAO e'
    # o healthcheck de proposito: ele da' 503 com o banco fora, com o ring
    # acima de ring.high_water e durante a reingestao de dumps no boot, e
    # marcar o container unhealthy por isso (ou reinicia-lo, num orquestrador
    # que o faca) nao conserta um banco inalcancavel -- so' troca o ring em RAM
    # por um dump e uma reingestao. /readyz e' para o balanceador e para o
    # operador (README, "Saude").
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9104/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

    # So' leitura. O /data gravavel e' um volume nomeado POR INSTANCIA,
    # declarado no docker-compose.yml.
    volumes:
      # conf/gelf.ini: as chaves recarregaveis. A PASTA, nao o arquivo: um
      # bind de arquivo prende o inode, e o editor que salva por rename deixaria
      # o container lendo a versao antiga para sempre.
      - ./conf:/etc/gelf:ro

    # read_only transforma "so' /data e' gravavel" em garantia: um caminho de
    # escrita fora do volume falha no boot em vez de gravar na camada efemera.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    deploy:
      resources:
        limits:
          memory: ${GELF_MEMORY_LIMIT:-768M}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
