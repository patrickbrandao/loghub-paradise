# ring compartilhado num Redis (stream syslog:ring)  ->  NATS JetStream (loghub.<space>.syslog)
#
# Garantia (TCP/TLS): o XADD no Redis do ring (AOF everysec). Replicas que
#   compartilham o stream PRECISAM da mesma config de conversao (SPEC §3.5).
#
#   docker compose -f compose.redis-nats.yml up -d --build
#
# Publicado no host: syslog 5158/udp e 5158/tcp (SYSLOG_PORT), TLS 16518
# quando ligado (SYSLOG_TLS_PORT), admin 127.0.0.1:19118 (SYSLOG_ADMIN_PORT).
# Defaults distintos por combinacao para que varias rodem lado a lado.

name: sls-redis-nats

services:
  syslog:
    extends:
      file: common.yml
      service: sls-base
    container_name: sls-redis-nats
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: sls-redis-nats
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      ring-redis:
        condition: service_healthy
    environment:
      # --- ring: redis -------------------------------------------------------
      SYSLOG_RING_MODE: redis
      SYSLOG_RING_REDIS_ADDRS: ring-redis:6379
      SYSLOG_RING_REDIS_STREAM: ${SYSLOG_RING_REDIS_STREAM:-syslog:ring}
      SYSLOG_RING_REDIS_GROUP: ${SYSLOG_RING_REDIS_GROUP:-syslog-ring}
      SYSLOG_RING_REDIS_CLAIM_IDLE: ${SYSLOG_RING_REDIS_CLAIM_IDLE:-30s}
      # Teto GLOBAL do stream, somando todas as replicas (SPEC §9.5).
      SYSLOG_RING_CAPACITY_ITEMS: ${SYSLOG_RING_CAPACITY_ITEMS:-65536}
      SYSLOG_RING_MAX_BYTES: ${SYSLOG_RING_MAX_BYTES:-512MiB}
      SYSLOG_EMERGENCY_ENABLED: "false"

      # --- sink: nats --------------------------------------------------------
      SYSLOG_SINK_TYPE: nats
      SYSLOG_SINK_NATS_MODE: ${SYSLOG_SINK_NATS_MODE:-jetstream}
      SYSLOG_SINK_NATS_STREAM: ${SYSLOG_SINK_NATS_STREAM:-LOGHUB_SYSLOG}
      SYSLOG_SINK_NATS_SUBJECTS: ${SYSLOG_SINK_NATS_SUBJECTS:-exact}
      # Heartbeat beacon em loghub._ctl.beacon a cada 15 s (SPEC §11).
      LOGHUB_BEACON_INTERVAL: ${LOGHUB_BEACON_INTERVAL:-15}
      # Conexao: as chaves "donas" do LOGHUB_EB_URL (SPEC §10.9). Para usar a
      # URL no lugar delas, apague as quatro linhas abaixo e descomente a
      # LOGHUB_EB_URL (README). As sem valor so' entram se definidas no .env
      # ou no shell: vazias contariam como explicitas e travariam a URL.
      SYSLOG_SINK_NATS_URLS: nats://nats:4222
      SYSLOG_SINK_NATS_USERNAME:
      SYSLOG_SINK_NATS_PASSWORD:
      SYSLOG_SINK_NATS_TLS:
      #LOGHUB_EB_URL: ${LOGHUB_EB_URL:?defina LOGHUB_EB_URL no .env ou no shell}

    ports:
      # SYSLOG_PORT do host na 1514 do container: a imagem nao abre porta privilegiada.
      - "${SYSLOG_PORT:-5158}:1514/udp"
      - "${SYSLOG_PORT:-5158}:1514/tcp"
      - "${SYSLOG_TLS_PORT:-16518}:6514/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${SYSLOG_ADMIN_PORT:-19118}:9102"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - sls-data:/data

  nats:
    image: ${SYSLOG_NATS_IMAGE:-nats:2.11-alpine}
    container_name: sls-redis-nats-nats
    hostname: sls-redis-nats-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats-data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "127.0.0.1:${SYSLOG_NATS_PORT:-14218}:4222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # O stream e' criado aqui, a partir do arquivo que o operador aplica; o syslog
  # so' o valida (nunca cria nem altera um stream, SPEC §10.7).
  nats-init:
    image: ${SYSLOG_NATS_BOX_IMAGE:-natsio/nats-box:0.20.0}
    container_name: sls-redis-nats-nats-init
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./nats/stream.json:/etc/nats/stream.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        nats --server nats://nats:4222 stream info ${SYSLOG_SINK_NATS_STREAM:-LOGHUB_SYSLOG} >/dev/null 2>&1
        || nats --server nats://nats:4222 stream add ${SYSLOG_SINK_NATS_STREAM:-LOGHUB_SYSLOG} --config /etc/nats/stream.json

  ring-redis:
    image: ${SYSLOG_REDIS_IMAGE:-redis:7.4-alpine}
    container_name: sls-redis-nats-ring-redis
    hostname: sls-redis-nats-ring-redis
    restart: unless-stopped
    command:
      # AOF com fsync a cada segundo: perde no maximo 1 s num crash do Redis.
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - ring-redis-data:/data
    ports:
      - "127.0.0.1:${SYSLOG_RING_REDIS_PORT:-16418}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  sls-data:
  nats-data:
  ring-redis-data:
