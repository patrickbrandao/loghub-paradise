# ring sem ring  ->  ClickHouse compartilhado (tabela inbox_syslog)
#
# Garantia (TCP/TLS): a escrita no destino terminou antes de voltar a ler.
#   O modo lento por definicao: a conversao roda na recepcao.
#
#   docker compose -f compose.none-clickhouse.yml up -d --build
#
# Publicado no host: syslog 5162/udp e 5162/tcp (SYSLOG_PORT), TLS 16522
# quando ligado (SYSLOG_TLS_PORT), admin 127.0.0.1:19122 (SYSLOG_ADMIN_PORT).
# Defaults distintos por combinacao para que varias rodem lado a lado.

name: sls-none-clickhouse

services:
  syslog:
    extends:
      file: common.yml
      service: sls-base
    container_name: sls-none-clickhouse
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: sls-none-clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # --- ring: none --------------------------------------------------------
      SYSLOG_RING_MODE: none
      # Igual ao pool (sink.workers = 4): sem ring a escrita e' sincrona, e um
      # max_inflight acima do pool so' cria fila escondida dentro dele (SPEC
      # §9.6; o boot avisa). Quem subir o pool sobe este junto.
      SYSLOG_RING_MAX_INFLIGHT: ${SYSLOG_RING_MAX_INFLIGHT:-4}
      SYSLOG_EMERGENCY_ENABLED: "false"

      # --- sink: clickhouse --------------------------------------------------
      SYSLOG_SINK_TYPE: clickhouse
      # Explicito: no padrao (8) o boot o rebaixaria para 4 com WARN, porque cada
      # worker prende uma conexao, e cada INSERT e' uma parte que o servidor
      # precisa fundir (SPEC §10.10). Acima de 16 tambem e' WARN.
      SYSLOG_SINK_WORKERS: "4"
      # Protocolo nativo (9000; 9440 com TLS), nao o HTTP (8123).
      SYSLOG_SINK_CLICKHOUSE_ADDRS: clickhouse:9000
      SYSLOG_SINK_CLICKHOUSE_USERNAME: ${SYSLOG_SINK_CLICKHOUSE_USERNAME:-syslog}
      SYSLOG_SINK_CLICKHOUSE_PASSWORD: ${SYSLOG_SINK_CLICKHOUSE_PASSWORD:-syslog}
      SYSLOG_SINK_CLICKHOUSE_DATABASE: ${SYSLOG_SINK_CLICKHOUSE_DATABASE:-syslog}
      SYSLOG_SINK_CLICKHOUSE_TABLE: ${SYSLOG_SINK_CLICKHOUSE_TABLE:-inbox_syslog}
      # 0 deriva sink.workers = 4 (a sonda de saude tem conexao propria, fora do pool).
      SYSLOG_SINK_CLICKHOUSE_POOL_SIZE: ${SYSLOG_SINK_CLICKHOUSE_POOL_SIZE:-0}
      SYSLOG_SINK_CLICKHOUSE_TLS: ${SYSLOG_SINK_CLICKHOUSE_TLS:-false}

    ports:
      # SYSLOG_PORT do host na 1514 do container: a imagem nao abre porta privilegiada.
      - "${SYSLOG_PORT:-5162}:1514/udp"
      - "${SYSLOG_PORT:-5162}:1514/tcp"
      - "${SYSLOG_TLS_PORT:-16522}:6514/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${SYSLOG_ADMIN_PORT:-19122}:9102"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - sls-data:/data

  clickhouse:
    image: ${SYSLOG_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    container_name: sls-none-clickhouse-clickhouse
    hostname: sls-none-clickhouse-clickhouse
    restart: unless-stopped
    environment:
      # A imagem cria o banco e o usuario. O mesmo usuario serve ao syslog neste
      # ambiente de desenvolvimento; em producao ele precisa so' de INSERT na
      # tabela e de um perfil com readonly = 0 (SPEC §10.10).
      CLICKHOUSE_DB: ${SYSLOG_SINK_CLICKHOUSE_DATABASE:-syslog}
      CLICKHOUSE_USER: ${SYSLOG_SINK_CLICKHOUSE_USERNAME:-syslog}
      CLICKHOUSE_PASSWORD: ${SYSLOG_SINK_CLICKHOUSE_PASSWORD:-syslog}
    # async_insert, wait_for_async_insert e fsync_after_insert ficam no padrao
    # da imagem (async_insert = 0): a garantia com ring=none mora no perfil do
    # usuario, e o servidor de syslog nao a le nem altera (SPEC §10.10).
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # O servidor nunca faz DDL (SPEC §10.10). inbox_syslog.sql fica fora do
      # initdb.d (a imagem rodaria um .sql de la' no banco default); o init.sh
      # o aplica UMA vez, na criacao do volume, dentro de CLICKHOUSE_DB.
      - ./clickhouse/inbox_syslog.sql:/etc/sls/inbox_syslog.sql:ro
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/001-inbox.sh:ro
    ports:
      - "127.0.0.1:${SYSLOG_CLICKHOUSE_PORT:-9012}:9000"
    healthcheck:
      # Saudavel so' quando a TABELA existe: o servidor responde antes de o
      # init.sh terminar, e o syslog sairia com 3 numa tabela ausente.
      test: ["CMD-SHELL", "test \"$$(clickhouse-client -u $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} -q \"EXISTS TABLE $${CLICKHOUSE_DB}.inbox_syslog\")\" = 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  sls-data:
  clickhouse-data:
