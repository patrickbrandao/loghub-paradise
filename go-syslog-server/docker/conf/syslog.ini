# go-syslog-server -- as chaves RECARREGAVEIS por SIGHUP (docs/SPEC.md §16.3).
#
# Os compose montam esta pasta so' leitura em /etc/syslog (common.yml) e
# apontam SYSLOG_CONFIG para /etc/syslog/syslog.ini. Para mudar sem reiniciar:
#
#   1. edite este arquivo no host;
#   2. docker kill -s HUP <container>      (ex.: docker kill -s HUP sls-memory-nats)
#   3. confira no log: "SIGHUP: applied" com as chaves trocadas.
#
# Um valor invalido nao derruba nada: o log diz "SIGHUP: the new configuration
# is invalid and was NOT applied" e o servidor segue com a config anterior.
#
# Por que um arquivo e nao env: env vence o INI (SPEC §16.1), e o env de um
# container nao muda depois do `up`. Uma chave recarregavel definida por env
# nunca mudaria com o HUP. Por isso NENHUM arquivo deste diretorio (common.yml,
# compose.*.yml, .env.example) define estas chaves por env; nao as acrescente
# la'. Se alguem acrescentar, cada SIGHUP avisa (WARN) que a chave "is set in
# the config file, but an environment variable or a flag decides its value".
#
# So' as chaves recarregaveis moram aqui. Nao ponha chaves de restart (listen,
# ring, sink, [syslog]...): elas ficam no env dos compose, e a maioria ja' esta'
# la' -- o env vence, a do arquivo nao valeria nem no proximo boot, e cada
# SIGHUP avisaria com o mesmo WARN de chave sombreada. As que o
# env nao define so' valeriam no proximo boot, com um WARN "requires a restart
# and was ignored" a cada SIGHUP ate' la'.
#
# Todos os compose deste diretorio montam ESTE arquivo: uma edicao vale para
# toda combinacao de pe', no HUP de cada uma.
#
# Sintaxe: `chave = valor`; comentario so' em linha inteira (# ou ;): um `#` no
# meio do valor e' parte do valor. Os valores abaixo sao os padroes do registry
# (internal/config/registry.go, SPEC §16.5).

[filter]
# Aceita severity <= isto; nome RFC 5427 ou numero. MENOR e' MAIS grave:
#   0 emerg, 1 alert, 2 crit, 3 err, 4 warning, 5 notice, 6 info, 7 debug
# 7 (debug) aceita tudo; warning guarda emerg..warning.
min_severity = 7
# Facilities aceitas, por nome RFC 5427 ou numero, separadas por virgula
# (local0,local1,auth). Vazio aceita todas.
facilities =

[ratelimit]
# Desligado, e por isso o boot avisa (WARN): os listeners do container escutam
# em 0.0.0.0, fora do loopback. O limite e' por prefixo do IP de origem, e atras
# do NAT do Docker (Docker Desktop, userland-proxy) os emissores podem chegar
# todos com o IP do gateway: o limitador estrangularia todos juntos, e um
# limitador com a chave errada e' pior que nenhum. Ligue quando o src-ip for
# real: network_mode host, PROXY protocol (SYSLOG_PROXY_PROTOCOL), ou DNAT que
# preserva a origem. Nunca se aplica ao unix.
enabled = false
# Tokens por segundo e capacidade do balde, por prefixo de rede.
rate = 1000
burst = 2000
# Tamanho do prefixo que vira a chave do balde.
v4_mask = 24
v6_mask = 48
# CIDRs isentos, separados por virgula.
exempt =
# Teto de prefixos rastreados; acima dele, prefixo novo passa sem limite.
max_buckets = 1000000
# De quanto em quanto tempo os baldes cheios saem da memoria; zero e' recusado.
sweep_interval = 30s

[sink.sqlite]
# Arquivos rotacionados a manter (com SYSLOG_SINK_SQLITE_ROTATE); 0 nunca apaga
# nada. So' age nos compose.*-sqlite.yml; com outro sink nao ha o que aplicar.
keep_files = 0

[log]
# Nivel do log do proprio servidor: debug | info | warn | error.
level = info
# Log por mensagem recebida, amostrado: aqui isso e' literalmente logar log.
access = false
# Fracao das mensagens logadas quando access = true, em [0, 1].
access_sample = 0.01
