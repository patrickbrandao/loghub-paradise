# ring na RAM  ->  Redis Stream (loghub.<space>.gelf, campo e)
#
# Garantia (TCP/TLS): a mensagem esta' na RAM deste no'. SIGTERM nao perde
#   (dreno); FATAL do sink nao perde (dump); SIGKILL e OOM perdem o backlog.
#
#   docker compose -f compose.memory-redis.yml up -d --build
#
# Publicado no host: GELF 22011/udp e 22011/tcp (GELF_PORT), HTTP 22012 (GELF_HTTP_PORT),
# TCP+TLS 22013 e HTTPS 22014 quando ligados (GELF_TLS_PORT, GELF_HTTPS_PORT),
# admin 127.0.0.1:29101 (GELF_ADMIN_PORT).
# Defaults distintos por combinacao para que varias rodem lado a lado.

name: gls-memory-redis

services:
  gelf:
    extends:
      file: common.yml
      service: gls-base
    container_name: gls-memory-redis
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: gls-memory-redis
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # --- ring: memory ------------------------------------------------------
      GELF_RING_MODE: memory
      GELF_RING_CAPACITY_ITEMS: ${GELF_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): o boot avisa se GOMEMLIMIT
      # for menor que o dobro (SPEC §15.4). Quem subir um sobe o outro.
      GELF_RING_MAX_BYTES: ${GELF_RING_MAX_BYTES:-256MiB}
      GELF_RING_HIGH_WATER: ${GELF_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL despeja o backlog em
      # /data/emergency e reingere no boot seguinte (SPEC §12).
      GELF_EMERGENCY_ENABLED: "true"

      # --- sink: redis -------------------------------------------------------
      GELF_SINK_TYPE: redis
      GELF_SINK_REDIS_STREAM: ${GELF_SINK_REDIS_STREAM:-loghub.{space}.gelf}
      # 0 desliga o trim: MAXLEN descartaria envelopes antigos em silencio.
      GELF_SINK_REDIS_MAXLEN: ${GELF_SINK_REDIS_MAXLEN:-0}
      # Conexao: as chaves "donas" do LOGHUB_EB_URL (SPEC §10.9). Para usar a
      # URL no lugar delas, apague as quatro linhas abaixo e descomente a
      # LOGHUB_EB_URL (README). As sem valor so' entram se definidas no .env
      # ou no shell: vazias contariam como explicitas e travariam a URL.
      GELF_SINK_REDIS_ADDRS: redis:6379
      GELF_SINK_REDIS_DB:
      GELF_SINK_REDIS_USERNAME:
      GELF_SINK_REDIS_PASSWORD:
      #LOGHUB_EB_URL: ${LOGHUB_EB_URL:?defina LOGHUB_EB_URL no .env ou no shell}

    ports:
      # As portas do container sao as do GELF (SPEC §4.1); o host escolhe.
      - "${GELF_PORT:-22011}:12201/udp"
      - "${GELF_PORT:-22011}:12201/tcp"
      - "${GELF_HTTP_PORT:-22012}:12202/tcp"
      - "${GELF_TLS_PORT:-22013}:12203/tcp"
      - "${GELF_HTTPS_PORT:-22014}:12204/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${GELF_ADMIN_PORT:-29101}:9104"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - gls-data:/data

  redis:
    image: ${GELF_REDIS_IMAGE:-redis:7.4-alpine}
    container_name: gls-memory-redis-redis
    hostname: gls-memory-redis-redis
    restart: unless-stopped
    command:
      # AOF com fsync a cada segundo: perde no maximo 1 s num crash do Redis.
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${GELF_REDIS_PORT:-26301}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  gls-data:
  redis-data:
