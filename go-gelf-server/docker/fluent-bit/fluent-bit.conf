# Emissor GELF de demonstracao (compose.demo.yml, perfil "demo").
#
# Duas saidas gelf do fluent-bit contra o servico `gelf` do compose:
#
#   gelf.udp  UDP, gzip (Compress On) e Packet_Size 1420: cada registro leva um
#             campo `blob` de ~12 KiB aleatorio (gelf-demo.lua), que comprimido
#             ainda passa de 1420 bytes e por isso sai em varios chunks GELF.
#             Prova a remontagem de chunks e a descompressao (SPEC §5.2, §5.4).
#   gelf.tcp  TCP, moldura \0, um registro pequeno (SPEC §5.3).
#
# O que chega aparece no destino da combinacao (payload.chunks > 1 e
# payload.compression = "gzip" nos de UDP; payload.transport = "tcp" nos outros)
# e em /metrics: gelf_messages_total{transport="udp"|"tcp"}.
#
# GELF_DEMO_HOST e GELF_DEMO_INTERVAL vem do compose.demo.yml.

[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name         dummy
    Tag          gelf.udp
    Dummy        {"short_message":"fluent-bit udp chunked gzip demo","level":6,"host":"fluent-bit-demo","origin":"udp"}
    Interval_Sec ${GELF_DEMO_INTERVAL}

[INPUT]
    Name         dummy
    Tag          gelf.tcp
    Dummy        {"short_message":"fluent-bit tcp demo","level":5,"host":"fluent-bit-demo","origin":"tcp"}
    Interval_Sec ${GELF_DEMO_INTERVAL}

[FILTER]
    Name         lua
    Match        gelf.udp
    Script       /fluent-bit/etc/gelf-demo.lua
    Call         add_blob

[OUTPUT]
    Name                    gelf
    Match                   gelf.udp
    Host                    ${GELF_DEMO_HOST}
    Port                    12201
    Mode                    udp
    Compress                On
    Packet_Size             1420
    Gelf_Short_Message_Key  short_message
    Gelf_Host_Key           host
    Gelf_Level_Key          level

[OUTPUT]
    Name                    gelf
    Match                   gelf.tcp
    Host                    ${GELF_DEMO_HOST}
    Port                    12201
    Mode                    tcp
    Gelf_Short_Message_Key  short_message
    Gelf_Host_Key           host
    Gelf_Level_Key          level
