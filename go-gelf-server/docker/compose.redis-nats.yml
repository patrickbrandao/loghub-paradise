# ring compartilhado num Redis (stream gelf:ring)  ->  NATS JetStream (loghub.<space>.gelf)
#
# Garantia (TCP/TLS): o XADD no Redis do ring (AOF everysec). Replicas que
#   compartilham o stream PRECISAM da mesma config de conversao (SPEC §3.5).
#
#   docker compose -f compose.redis-nats.yml up -d --build
#
# Publicado no host: GELF 22181/udp e 22181/tcp (GELF_PORT), HTTP 22182 (GELF_HTTP_PORT),
# TCP+TLS 22183 e HTTPS 22184 quando ligados (GELF_TLS_PORT, GELF_HTTPS_PORT),
# admin 127.0.0.1:29118 (GELF_ADMIN_PORT).
# Defaults distintos por combinacao para que varias rodem lado a lado.

name: gls-redis-nats

services:
  gelf:
    extends:
      file: common.yml
      service: gls-base
    container_name: gls-redis-nats
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: gls-redis-nats
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      ring-redis:
        condition: service_healthy
    environment:
      # --- ring: redis -------------------------------------------------------
      GELF_RING_MODE: redis
      GELF_RING_REDIS_ADDRS: ring-redis:6379
      GELF_RING_REDIS_STREAM: ${GELF_RING_REDIS_STREAM:-gelf:ring}
      GELF_RING_REDIS_GROUP: ${GELF_RING_REDIS_GROUP:-gelf-ring}
      GELF_RING_REDIS_CLAIM_IDLE: ${GELF_RING_REDIS_CLAIM_IDLE:-30s}
      # Teto GLOBAL do stream, somando todas as replicas (SPEC §9.5).
      GELF_RING_CAPACITY_ITEMS: ${GELF_RING_CAPACITY_ITEMS:-65536}
      GELF_RING_MAX_BYTES: ${GELF_RING_MAX_BYTES:-512MiB}
      GELF_EMERGENCY_ENABLED: "false"

      # --- sink: nats --------------------------------------------------------
      GELF_SINK_TYPE: nats
      GELF_SINK_NATS_MODE: ${GELF_SINK_NATS_MODE:-jetstream}
      GELF_SINK_NATS_STREAM: ${GELF_SINK_NATS_STREAM:-LOGHUB_GELF}
      # Heartbeat beacon em loghub._ctl.beacon a cada 15 s (SPEC §11).
      LOGHUB_BEACON_INTERVAL: ${LOGHUB_BEACON_INTERVAL:-15}
      # Conexao: as chaves "donas" do LOGHUB_EB_URL (SPEC §10.9). Para usar a
      # URL no lugar delas, apague as quatro linhas abaixo e descomente a
      # LOGHUB_EB_URL (README). As sem valor so' entram se definidas no .env
      # ou no shell: vazias contariam como explicitas e travariam a URL.
      GELF_SINK_NATS_URLS: nats://nats:4222
      GELF_SINK_NATS_USERNAME:
      GELF_SINK_NATS_PASSWORD:
      GELF_SINK_NATS_TLS:
      #LOGHUB_EB_URL: ${LOGHUB_EB_URL:?defina LOGHUB_EB_URL no .env ou no shell}

    ports:
      # As portas do container sao as do GELF (SPEC §4.1); o host escolhe.
      - "${GELF_PORT:-22181}:12201/udp"
      - "${GELF_PORT:-22181}:12201/tcp"
      - "${GELF_HTTP_PORT:-22182}:12202/tcp"
      - "${GELF_TLS_PORT:-22183}:12203/tcp"
      - "${GELF_HTTPS_PORT:-22184}:12204/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${GELF_ADMIN_PORT:-29118}:9104"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - gls-data:/data

  nats:
    image: ${GELF_NATS_IMAGE:-nats:2.11-alpine}
    container_name: gls-redis-nats-nats
    hostname: gls-redis-nats-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - nats-data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "127.0.0.1:${GELF_NATS_PORT:-24218}:4222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # O stream e' criado aqui, a partir do arquivo que o operador aplica; o servidor
  # so' o valida (nunca cria nem altera um stream, SPEC §10.7).
  nats-init:
    image: ${GELF_NATS_BOX_IMAGE:-natsio/nats-box:0.20.0}
    container_name: gls-redis-nats-nats-init
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./nats/stream.json:/etc/nats/stream.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        nats --server nats://nats:4222 stream info ${GELF_SINK_NATS_STREAM:-LOGHUB_GELF} >/dev/null 2>&1
        || nats --server nats://nats:4222 stream add ${GELF_SINK_NATS_STREAM:-LOGHUB_GELF} --config /etc/nats/stream.json

  ring-redis:
    image: ${GELF_REDIS_IMAGE:-redis:7.4-alpine}
    container_name: gls-redis-nats-ring-redis
    hostname: gls-redis-nats-ring-redis
    restart: unless-stopped
    command:
      # AOF com fsync a cada segundo: perde no maximo 1 s num crash do Redis.
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - ring-redis-data:/data
    ports:
      - "127.0.0.1:${GELF_RING_REDIS_PORT:-26418}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  gls-data:
  nats-data:
  ring-redis-data:
