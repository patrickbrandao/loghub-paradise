# nats-server dos compose.*-nats.yml.
#
# max_payload conta headers e dados de cada mensagem. O pior JLH deste servidor
# e' 6 x convert.max_message_bytes + 8 KiB: 776 KiB com o padrao de 128 KiB
# (docs/SPEC.md §3.9), e o boot sai com codigo 3 se ele nao couber. O 1 MiB
# padrao do nats-server basta; ele fica explicito aqui para que quem suba
# GELF_CONVERT_MAX_MESSAGE_BYTES acima de ~170 KiB saiba o que subir junto.
#
# O stream LOGHUB_GELF NAO e' criado pelo servidor: o servico nats-init dos
# compose o cria a partir de stream.json, e o servidor so' o valida no boot
# (docs/SPEC.md §10.7). O plano de controle (loghub._ctl.beacon) nao vai para
# stream nenhum: e' fanout por NATS core.
port: 4222
http_port: 8222
max_payload: 1MB

jetstream {
  store_dir: /data
}
