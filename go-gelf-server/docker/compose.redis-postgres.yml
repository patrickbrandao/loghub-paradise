# ring compartilhado num Redis (stream gelf:ring)  ->  PostgreSQL compartilhado (fila loghub.inbox)
#
# Garantia (TCP/TLS): o XADD no Redis do ring (AOF everysec). Replicas que
#   compartilham o stream PRECISAM da mesma config de conversao (SPEC §3.5).
#
#   docker compose -f compose.redis-postgres.yml up -d --build
#
# Publicado no host: GELF 22191/udp e 22191/tcp (GELF_PORT), HTTP 22192 (GELF_HTTP_PORT),
# TCP+TLS 22193 e HTTPS 22194 quando ligados (GELF_TLS_PORT, GELF_HTTPS_PORT),
# admin 127.0.0.1:29119 (GELF_ADMIN_PORT).
# Defaults distintos por combinacao para que varias rodem lado a lado.

name: gls-redis-postgres

services:
  gelf:
    extends:
      file: common.yml
      service: gls-base
    container_name: gls-redis-postgres
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: gls-redis-postgres
    depends_on:
      postgres:
        condition: service_healthy
      ring-redis:
        condition: service_healthy
    environment:
      # --- ring: redis -------------------------------------------------------
      GELF_RING_MODE: redis
      GELF_RING_REDIS_ADDRS: ring-redis:6379
      GELF_RING_REDIS_STREAM: ${GELF_RING_REDIS_STREAM:-gelf:ring}
      GELF_RING_REDIS_GROUP: ${GELF_RING_REDIS_GROUP:-gelf-ring}
      GELF_RING_REDIS_CLAIM_IDLE: ${GELF_RING_REDIS_CLAIM_IDLE:-30s}
      # Teto GLOBAL do stream, somando todas as replicas (SPEC §9.5).
      GELF_RING_CAPACITY_ITEMS: ${GELF_RING_CAPACITY_ITEMS:-65536}
      GELF_RING_MAX_BYTES: ${GELF_RING_MAX_BYTES:-512MiB}
      GELF_EMERGENCY_ENABLED: "false"

      # --- sink: postgres ----------------------------------------------------
      GELF_SINK_TYPE: postgres
      # Explicito: no padrao (8) o boot o rebaixaria para 4 com WARN, porque cada
      # worker prende uma conexao de um orcamento que a frota inteira divide
      # (SPEC §10.5). Acima de 16 tambem e' WARN.
      GELF_SINK_WORKERS: "4"
      GELF_SINK_POSTGRES_TABLE: ${GELF_SINK_POSTGRES_TABLE:-loghub.inbox}
      # 0 deriva sink.workers = 4 (a sonda de saude tem conexao propria, fora do pool).
      GELF_SINK_POSTGRES_POOL_SIZE: ${GELF_SINK_POSTGRES_POOL_SIZE:-0}
      # Conexao: as chaves "donas" do LOGHUB_EB_URL (SPEC §10.9). Para usar a
      # URL no lugar delas, apague as quatro linhas abaixo e descomente a
      # LOGHUB_EB_URL (README); a URL leva a senha do servico postgres abaixo
      # (postgres://gelf:gelf@postgres:5432/gelf). Usuario e banco sem
      # valor so' entram se definidos no .env ou no shell; sem eles vale o
      # padrao do servidor, gelf/gelf, o mesmo do servico postgres.
      GELF_SINK_POSTGRES_ADDR: postgres:5432
      GELF_SINK_POSTGRES_PASSWORD: ${GELF_SINK_POSTGRES_PASSWORD:-gelf}
      GELF_SINK_POSTGRES_USERNAME:
      GELF_SINK_POSTGRES_DATABASE:
      #LOGHUB_EB_URL: ${LOGHUB_EB_URL:?defina LOGHUB_EB_URL no .env ou no shell}

    ports:
      # As portas do container sao as do GELF (SPEC §4.1); o host escolhe.
      - "${GELF_PORT:-22191}:12201/udp"
      - "${GELF_PORT:-22191}:12201/tcp"
      - "${GELF_HTTP_PORT:-22192}:12202/tcp"
      - "${GELF_TLS_PORT:-22193}:12203/tcp"
      - "${GELF_HTTPS_PORT:-22194}:12204/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${GELF_ADMIN_PORT:-29119}:9104"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - gls-data:/data

  postgres:
    image: ${GELF_POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: gls-redis-postgres-postgres
    hostname: gls-redis-postgres-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GELF_SINK_POSTGRES_USERNAME:-gelf}
      POSTGRES_PASSWORD: ${GELF_SINK_POSTGRES_PASSWORD:-gelf}
      POSTGRES_DB: ${GELF_SINK_POSTGRES_DATABASE:-gelf}
    volumes:
      # A imagem 18 guarda os dados em /var/lib/postgresql/18/docker e recusa
      # um volume montado no antigo /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
      # O servidor nunca faz DDL (SPEC §10.5): a fila loghub.inbox vem daqui,
      # na criacao do volume (DDL literal da skill, SPEC §3.7.1).
      - ./postgres/inbox.sql:/docker-entrypoint-initdb.d/10-inbox.sql:ro
    ports:
      - "127.0.0.1:${GELF_POSTGRES_PORT:-25419}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GELF_SINK_POSTGRES_USERNAME:-gelf} -d ${GELF_SINK_POSTGRES_DATABASE:-gelf}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  ring-redis:
    image: ${GELF_REDIS_IMAGE:-redis:7.4-alpine}
    container_name: gls-redis-postgres-ring-redis
    hostname: gls-redis-postgres-ring-redis
    restart: unless-stopped
    command:
      # AOF com fsync a cada segundo: perde no maximo 1 s num crash do Redis.
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - ring-redis-data:/data
    ports:
      - "127.0.0.1:${GELF_RING_REDIS_PORT:-26419}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  gls-data:
  postgres-data:
  ring-redis-data:
