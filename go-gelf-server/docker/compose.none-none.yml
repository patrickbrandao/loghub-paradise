# ring sem ring  ->  descarte (benchmark de transporte)
#
# Garantia: NENHUMA. A conversao roda na recepcao e o envelope e' DESCARTADO
#   (SPEC §10.8, §19: "qualquer + none" perde tudo); sem semaforo de
#   max_inflight (SPEC §9.6). Mede recepcao, moldura, conversao e serializacao
#   sem ring e sem destino. Nao guarde log com isto.
#
#   docker compose -f compose.none-none.yml up -d --build
#
# Publicado no host: GELF 22171/udp e 22171/tcp (GELF_PORT), HTTP 22172 (GELF_HTTP_PORT),
# TCP+TLS 22173 e HTTPS 22174 quando ligados (GELF_TLS_PORT, GELF_HTTPS_PORT),
# admin 127.0.0.1:29117 (GELF_ADMIN_PORT).
# Defaults distintos por combinacao para que varias rodem lado a lado.

name: gls-none-none

services:
  gelf:
    extends:
      file: common.yml
      service: gls-base
    container_name: gls-none-none
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: gls-none-none
    environment:
      # --- ring: none --------------------------------------------------------
      GELF_RING_MODE: none
      # Sem ring.max_inflight: com sink=none o semaforo e' dispensado (SPEC §9.6).
      GELF_EMERGENCY_ENABLED: "false"

      # --- sink: none --------------------------------------------------------
      GELF_SINK_TYPE: none

    ports:
      # As portas do container sao as do GELF (SPEC §4.1); o host escolhe.
      - "${GELF_PORT:-22171}:12201/udp"
      - "${GELF_PORT:-22171}:12201/tcp"
      - "${GELF_HTTP_PORT:-22172}:12202/tcp"
      - "${GELF_TLS_PORT:-22173}:12203/tcp"
      - "${GELF_HTTPS_PORT:-22174}:12204/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${GELF_ADMIN_PORT:-29117}:9104"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - gls-data:/data

volumes:
  gls-data:
