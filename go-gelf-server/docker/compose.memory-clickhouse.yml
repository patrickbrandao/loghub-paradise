# ring na RAM  ->  ClickHouse compartilhado (tabela inbox_gelf)
#
# Garantia (TCP/TLS): a mensagem esta' na RAM deste no'. SIGTERM nao perde
#   (dreno); FATAL do sink nao perde (dump); SIGKILL e OOM perdem o backlog.
#
#   docker compose -f compose.memory-clickhouse.yml up -d --build
#
# Publicado no host: GELF 22201/udp e 22201/tcp (GELF_PORT), HTTP 22202 (GELF_HTTP_PORT),
# TCP+TLS 22203 e HTTPS 22204 quando ligados (GELF_TLS_PORT, GELF_HTTPS_PORT),
# admin 127.0.0.1:29120 (GELF_ADMIN_PORT).
# Defaults distintos por combinacao para que varias rodem lado a lado.

name: gls-memory-clickhouse

services:
  gelf:
    extends:
      file: common.yml
      service: gls-base
    container_name: gls-memory-clickhouse
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: gls-memory-clickhouse
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      # --- ring: memory ------------------------------------------------------
      GELF_RING_MODE: memory
      GELF_RING_CAPACITY_ITEMS: ${GELF_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): o boot avisa se GOMEMLIMIT
      # for menor que o dobro (SPEC §15.4). Quem subir um sobe o outro.
      GELF_RING_MAX_BYTES: ${GELF_RING_MAX_BYTES:-256MiB}
      GELF_RING_HIGH_WATER: ${GELF_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL despeja o backlog em
      # /data/emergency e reingere no boot seguinte (SPEC §12).
      GELF_EMERGENCY_ENABLED: "true"

      # --- sink: clickhouse --------------------------------------------------
      GELF_SINK_TYPE: clickhouse
      # Explicito: no padrao (8) o boot o rebaixaria para 4 com WARN, porque cada
      # worker prende uma conexao, e cada INSERT e' uma parte que o servidor
      # precisa fundir (SPEC §10.10). Acima de 16 tambem e' WARN.
      GELF_SINK_WORKERS: "4"
      # Protocolo nativo (9000; 9440 com TLS), nao o HTTP (8123).
      GELF_SINK_CLICKHOUSE_ADDRS: clickhouse:9000
      GELF_SINK_CLICKHOUSE_USERNAME: ${GELF_SINK_CLICKHOUSE_USERNAME:-gelf}
      GELF_SINK_CLICKHOUSE_PASSWORD: ${GELF_SINK_CLICKHOUSE_PASSWORD:-gelf}
      GELF_SINK_CLICKHOUSE_DATABASE: ${GELF_SINK_CLICKHOUSE_DATABASE:-gelf}
      GELF_SINK_CLICKHOUSE_TABLE: ${GELF_SINK_CLICKHOUSE_TABLE:-inbox_gelf}
      # 0 deriva sink.workers = 4 (a sonda de saude tem conexao propria, fora do pool).
      GELF_SINK_CLICKHOUSE_POOL_SIZE: ${GELF_SINK_CLICKHOUSE_POOL_SIZE:-0}
      GELF_SINK_CLICKHOUSE_TLS: ${GELF_SINK_CLICKHOUSE_TLS:-false}

    ports:
      # As portas do container sao as do GELF (SPEC §4.1); o host escolhe.
      - "${GELF_PORT:-22201}:12201/udp"
      - "${GELF_PORT:-22201}:12201/tcp"
      - "${GELF_HTTP_PORT:-22202}:12202/tcp"
      - "${GELF_TLS_PORT:-22203}:12203/tcp"
      - "${GELF_HTTPS_PORT:-22204}:12204/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${GELF_ADMIN_PORT:-29120}:9104"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - gls-data:/data

  clickhouse:
    image: ${GELF_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    container_name: gls-memory-clickhouse-clickhouse
    hostname: gls-memory-clickhouse-clickhouse
    restart: unless-stopped
    environment:
      # A imagem cria o banco e o usuario. O mesmo usuario serve ao servidor neste
      # ambiente de desenvolvimento; em producao ele precisa so' de INSERT na
      # tabela e de um perfil com readonly = 0 (SPEC §10.10).
      CLICKHOUSE_DB: ${GELF_SINK_CLICKHOUSE_DATABASE:-gelf}
      CLICKHOUSE_USER: ${GELF_SINK_CLICKHOUSE_USERNAME:-gelf}
      CLICKHOUSE_PASSWORD: ${GELF_SINK_CLICKHOUSE_PASSWORD:-gelf}
    # async_insert, wait_for_async_insert e fsync_after_insert ficam no padrao
    # da imagem (async_insert = 0): a garantia com ring=none mora no perfil do
    # usuario, e o servidor GELF nao a le nem altera (SPEC §10.10).
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # O servidor nunca faz DDL (SPEC §10.10). inbox_gelf.sql fica fora do
      # initdb.d (a imagem rodaria um .sql de la' no banco default); o init.sh
      # o aplica UMA vez, na criacao do volume, dentro de CLICKHOUSE_DB.
      - ./clickhouse/inbox_gelf.sql:/etc/gls/inbox_gelf.sql:ro
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/001-inbox.sh:ro
    ports:
      - "127.0.0.1:${GELF_CLICKHOUSE_PORT:-19010}:9000"
    healthcheck:
      # Saudavel so' quando a TABELA existe: o servidor responde antes de o
      # init.sh terminar, e o servidor sairia com 3 numa tabela ausente.
      test: ["CMD-SHELL", "test \"$$(clickhouse-client -u $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} -q \"EXISTS TABLE $${CLICKHOUSE_DB}.inbox_gelf\")\" = 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  gls-data:
  clickhouse-data:
