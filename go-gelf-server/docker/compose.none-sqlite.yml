# ring sem ring  ->  SQLite local (/data/events.db, tabela gelf_events)
#
# Garantia (TCP/TLS): a escrita no destino terminou antes de voltar a ler.
#   O modo lento por definicao: a conversao roda na recepcao.
#
#   docker compose -f compose.none-sqlite.yml up -d --build
#
# Publicado no host: GELF 22141/udp e 22141/tcp (GELF_PORT), HTTP 22142 (GELF_HTTP_PORT),
# TCP+TLS 22143 e HTTPS 22144 quando ligados (GELF_TLS_PORT, GELF_HTTPS_PORT),
# admin 127.0.0.1:29114 (GELF_ADMIN_PORT).
# Defaults distintos por combinacao para que varias rodem lado a lado.

name: gls-none-sqlite

services:
  gelf:
    extends:
      file: common.yml
      service: gls-base
    container_name: gls-none-sqlite
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: gls-none-sqlite
    environment:
      # --- ring: none --------------------------------------------------------
      GELF_RING_MODE: none
      GELF_RING_MAX_INFLIGHT: ${GELF_RING_MAX_INFLIGHT:-2048}
      GELF_EMERGENCY_ENABLED: "false"

      # --- sink: sqlite ------------------------------------------------------
      GELF_SINK_TYPE: sqlite
      GELF_SINK_SQLITE_SYNCHRONOUS: ${GELF_SINK_SQLITE_SYNCHRONOUS:-FULL}
      GELF_SINK_SQLITE_ROTATE: ${GELF_SINK_SQLITE_ROTATE:-daily}
      # Quantos rotacionados manter (keep_files) e' recarregavel: conf/gelf.ini.
      GELF_SINK_WORKERS: "1"

    ports:
      # As portas do container sao as do GELF (SPEC §4.1); o host escolhe.
      - "${GELF_PORT:-22141}:12201/udp"
      - "${GELF_PORT:-22141}:12201/tcp"
      - "${GELF_HTTP_PORT:-22142}:12202/tcp"
      - "${GELF_TLS_PORT:-22143}:12203/tcp"
      - "${GELF_HTTPS_PORT:-22144}:12204/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${GELF_ADMIN_PORT:-29114}:9104"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - gls-data:/data

volumes:
  gls-data:
