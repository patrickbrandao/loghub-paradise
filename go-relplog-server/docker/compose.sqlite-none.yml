# ring em disco (ring.db)  ->  descarte (benchmark)
#
# Garantia: NENHUMA. O `200 OK` RELP sai depois do COMMIT com fsync no
#   /data/ring.db, mas o que sai do ring e' convertido, serializado e
#   DESCARTADO (SPEC §10.8, §19: "qualquer + none" perde tudo). Mede o custo do
#   ring em disco sem I/O de destino. Nao guarde log com isto.
#
#   docker compose -f compose.sqlite-none.yml up -d --build
#   docker compose -f compose.sqlite-none.yml -f compose.emitter.yml --profile demo up -d --build
#     (o mesmo, com o rsyslog de demonstracao mandando por omrelp)
#
# Publicado no host: RELP 20525 (RELPLOG_PORT), RELP/TLS 20625 quando ligado
# (RELPLOG_TLS_PORT), admin 127.0.0.1:9311 (RELPLOG_ADMIN_PORT). Defaults
# distintos por combinacao, e disjuntos dos do go-syslog-server, para que
# varias rodem lado a lado no mesmo host (README, "Portas").

name: rls-sqlite-none

services:
  relplog:
    extends:
      file: common.yml
      service: rls-base
    container_name: rls-sqlite-none
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: rls-sqlite-none
    environment:
      # --- ring: sqlite ------------------------------------------------------
      RELPLOG_RING_MODE: sqlite
      RELPLOG_RING_SQLITE_SYNCHRONOUS: ${RELPLOG_RING_SQLITE_SYNCHRONOUS:-FULL}
      RELPLOG_RING_CAPACITY_ITEMS: ${RELPLOG_RING_CAPACITY_ITEMS:-65536}
      RELPLOG_RING_MAX_BYTES: ${RELPLOG_RING_MAX_BYTES:-512MiB}
      RELPLOG_EMERGENCY_ENABLED: "false"

      # --- sink: none --------------------------------------------------------
      RELPLOG_SINK_TYPE: none

    ports:
      # As portas do container sao as padrao do RELP (SPEC §4.1): 20514 em claro
      # e 20515 para o TLS, que so' escuta com RELPLOG_LISTEN_TLS definido.
      - "${RELPLOG_PORT:-20525}:20514/tcp"
      - "${RELPLOG_TLS_PORT:-20625}:20515/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${RELPLOG_ADMIN_PORT:-9311}:9103"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - rls-data:/data

volumes:
  rls-data:
