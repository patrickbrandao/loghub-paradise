# ring em disco (ring.db)  ->  SQLite local (/data/events.db, tabela syslog_events)
#
# Garantia (por mensagem): o `200 OK` RELP sai so' depois do COMMIT com
#   fsync no /data/ring.db; zero perda sob crash do processo.
#
# WARN esperado no boot: "ring.mode=sqlite with sink.type=sqlite: every message
#   pays TWO fsyncs" (SPEC §9.7). Aqui ring.db e events.db estao no MESMO
#   volume, que e' o caso caro: compose.memory-sqlite.yml da' a mesma
#   durabilidade no destino pela metade do custo. Esta combinacao so' compensa
#   com os dois arquivos em discos distintos, sem sair da raiz /data (SPEC
#   §16.6): por exemplo RELPLOG_SINK_SQLITE_PATH=/data/disco2/events.db com um
#   segundo volume montado em /data/disco2.
#
#   docker compose -f compose.sqlite-sqlite.yml up -d --build
#   docker compose -f compose.sqlite-sqlite.yml -f compose.emitter.yml --profile demo up -d --build
#     (o mesmo, com o rsyslog de demonstracao mandando por omrelp)
#
# Publicado no host: RELP 20522 (RELPLOG_PORT), RELP/TLS 20622 quando ligado
# (RELPLOG_TLS_PORT), admin 127.0.0.1:9308 (RELPLOG_ADMIN_PORT). Defaults
# distintos por combinacao, e disjuntos dos do go-syslog-server, para que
# varias rodem lado a lado no mesmo host (README, "Portas").

name: rls-sqlite-sqlite

services:
  relplog:
    extends:
      file: common.yml
      service: rls-base
    container_name: rls-sqlite-sqlite
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: rls-sqlite-sqlite
    environment:
      # --- ring: sqlite ------------------------------------------------------
      RELPLOG_RING_MODE: sqlite
      RELPLOG_RING_SQLITE_SYNCHRONOUS: ${RELPLOG_RING_SQLITE_SYNCHRONOUS:-FULL}
      RELPLOG_RING_CAPACITY_ITEMS: ${RELPLOG_RING_CAPACITY_ITEMS:-65536}
      RELPLOG_RING_MAX_BYTES: ${RELPLOG_RING_MAX_BYTES:-512MiB}
      RELPLOG_EMERGENCY_ENABLED: "false"

      # --- sink: sqlite ------------------------------------------------------
      RELPLOG_SINK_TYPE: sqlite
      RELPLOG_SINK_SQLITE_SYNCHRONOUS: ${RELPLOG_SINK_SQLITE_SYNCHRONOUS:-FULL}
      RELPLOG_SINK_SQLITE_ROTATE: ${RELPLOG_SINK_SQLITE_ROTATE:-daily}
      # Quantos rotacionados manter (keep_files) e' recarregavel: conf/relplog.ini.
      RELPLOG_SINK_WORKERS: "1"

    ports:
      # As portas do container sao as padrao do RELP (SPEC §4.1): 20514 em claro
      # e 20515 para o TLS, que so' escuta com RELPLOG_LISTEN_TLS definido.
      - "${RELPLOG_PORT:-20522}:20514/tcp"
      - "${RELPLOG_TLS_PORT:-20622}:20515/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${RELPLOG_ADMIN_PORT:-9308}:9103"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - rls-data:/data

volumes:
  rls-data:
