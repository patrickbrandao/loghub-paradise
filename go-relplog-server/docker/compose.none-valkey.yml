# Valkey: a mesma combinacao de compose.none-redis.yml com a imagem
# ${RELPLOG_VALKEY_IMAGE:-valkey/valkey:8.1-alpine} (Valkey 7.2, 8.1 e 9.0 testados, SPEC
# §10.3.1). O servidor fala com ele pelas mesmas chaves *_REDIS_* (redis
# designa o protocolo; *_VALKEY_* sao aliases exatos).
#
# ring sem ring  ->  Redis Stream (loghub.<space>.syslog, campo e)
#
# Garantia (por mensagem): o `200 OK` RELP sai so' depois de o destino
#   confirmar: o XADD confirmado.
#   O modo lento por definicao: a conversao roda na transacao, com ate'
#   relp.window escritas em voo por conexao. Uma recusa `logic` do destino
#   e' final: `500 refused by the destination`; o rsyslog descarta e loga essa
#   linha, suspende a acao e retransmite as vizinhas da janela (duplicatas).
#
#   docker compose -f compose.none-valkey.yml up -d --build
#   docker compose -f compose.none-valkey.yml -f compose.emitter.yml --profile demo up -d --build
#     (o mesmo, com o rsyslog de demonstracao mandando por omrelp)
#
# Publicado no host: RELP 20538 (RELPLOG_PORT), RELP/TLS 20638 quando ligado
# (RELPLOG_TLS_PORT), admin 127.0.0.1:9324 (RELPLOG_ADMIN_PORT). Defaults
# distintos por combinacao, e disjuntos dos do go-syslog-server, para que
# varias rodem lado a lado no mesmo host (README, "Portas").
# Servicos de apoio no host: Valkey 127.0.0.1:26324 (RELPLOG_VALKEY_PORT).

name: rls-none-valkey

services:
  relplog:
    extends:
      file: common.yml
      service: rls-base
    container_name: rls-none-valkey
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: rls-none-valkey
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      # --- ring: none --------------------------------------------------------
      RELPLOG_RING_MODE: none
      RELPLOG_RING_MAX_INFLIGHT: ${RELPLOG_RING_MAX_INFLIGHT:-2048}
      RELPLOG_EMERGENCY_ENABLED: "false"

      # --- sink: redis -------------------------------------------------------
      RELPLOG_SINK_TYPE: redis
      RELPLOG_SINK_REDIS_STREAM: ${RELPLOG_SINK_REDIS_STREAM:-loghub.{space}.syslog}
      # 0 desliga o trim: MAXLEN descartaria envelopes antigos em silencio.
      RELPLOG_SINK_REDIS_MAXLEN: ${RELPLOG_SINK_REDIS_MAXLEN:-0}
      # Conexao: as chaves "donas" do LOGHUB_EB_URL (SPEC §10.9). Para usar a
      # URL no lugar delas, apague as quatro linhas abaixo e descomente a
      # LOGHUB_EB_URL (README). As sem valor so' entram se definidas no .env
      # ou no shell: vazias contariam como explicitas e travariam a URL.
      RELPLOG_SINK_REDIS_ADDRS: valkey:6379
      RELPLOG_SINK_REDIS_DB:
      RELPLOG_SINK_REDIS_USERNAME:
      RELPLOG_SINK_REDIS_PASSWORD:
      #LOGHUB_EB_URL: ${LOGHUB_EB_URL:?defina LOGHUB_EB_URL no .env ou no shell}

    ports:
      # As portas do container sao as padrao do RELP (SPEC §4.1): 20514 em claro
      # e 20515 para o TLS, que so' escuta com RELPLOG_LISTEN_TLS definido.
      - "${RELPLOG_PORT:-20538}:20514/tcp"
      - "${RELPLOG_TLS_PORT:-20638}:20515/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${RELPLOG_ADMIN_PORT:-9324}:9103"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - rls-data:/data

  valkey:
    image: ${RELPLOG_VALKEY_IMAGE:-valkey/valkey:8.1-alpine}
    container_name: rls-none-valkey-valkey
    hostname: rls-none-valkey-valkey
    restart: unless-stopped
    command:
      # AOF com fsync a cada segundo: perde no maximo 1 s num crash do Redis.
      # valkey-server, nao o symlink redis-server: o entrypoint da imagem so'
      # rebaixa para o usuario valkey e ajusta o /data com este nome.
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - valkey-data:/data
    ports:
      - "127.0.0.1:${RELPLOG_VALKEY_PORT:-26324}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  rls-data:
  valkey-data:
