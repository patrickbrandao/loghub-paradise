# nats-server dos compose.*-nats.yml.
#
# max_payload conta headers e dados de cada mensagem. O pior JLH deste servidor
# e' 12 x syslog.max_message_bytes + 8 KiB: 776 KiB com o padrao de 64 KiB
# (docs/SPEC.md §3.9), e o boot sai com codigo 3 se ele nao couber. O 1 MiB
# padrao do nats-server basta; ele fica explicito aqui para que quem suba
# SYSLOG_MAX_MESSAGE_BYTES acima de ~85 KiB saiba o que subir junto.
#
# O stream LOGHUB_SYSLOG NAO e' criado pelo go-relplog-server: o servico
# nats-init dos compose o cria a partir de stream.json, e o servidor so' o
# valida no boot (docs/SPEC.md §10.7). E' o MESMO stream (e o mesmo subject,
# loghub.<space>.syslog) do go-syslog-server: os dois publicam type=syslog, e
# o consumidor separa pelo payload (x-transport) ou pelo `from`. O plano de
# controle (loghub._ctl.beacon) nao vai para stream nenhum: e' fanout por NATS
# core.
port: 4222
http_port: 8222
max_payload: 1MB

jetstream {
  store_dir: /data
}
