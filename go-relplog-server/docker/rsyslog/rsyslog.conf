# rsyslog do emissor de DEMONSTRACAO (compose.emitter.yml, profile `demo`).
#
# Tambem e' o modelo para um rsyslog de verdade apontar para o
# go-relplog-server: copie o bloco "acao RELP" para /etc/rsyslog.d/ e troque o
# target. O que importa nele esta' comentado; o resto e' andaime do container.
#
# Caminho de cada linha: logger -> /dev/log -> imuxsock -> fila da acao (RAM,
# transbordando para disco) -> omrelp -> go-relplog-server. O rsyslog so' apaga
# uma mensagem da fila quando recebe o `200 OK` dela (docker/README.md, "O que o
# rsyslog ve").

global(
  # Onde a fila da acao transborda (queue.filename abaixo). E' um volume no
  # compose: a fila sobrevive a recriacao do container.
  workDirectory="/var/spool/rsyslog"
  # As mensagens do proprio rsyslogd (erros do omrelp inclusive) sao tratadas
  # aqui, pela regra "rsyslogd" abaixo, e nao reenviadas a /dev/log.
  # Os ERROS tambem saem crus em stderr (o rsyslogd -n faz isso sozinho): no
  # docker logs cada erro aparece duas vezes, uma sem e outra com data.
  processInternalMessages="on"
)

# imuxsock: /dev/log. O rate-limit padrao (200 mensagens a cada 5 s por
# processo) descartaria parte de uma rajada ANTES da fila; desligado, toda linha
# do logger entra na fila. Um rsyslog de producao decide isso por conta propria.
module(load="imuxsock" SysSock.RateLimit.Interval="0")

# O RELP. Sem tls.tlslib vale o padrao do librelp da distribuicao (GnuTLS ou
# OpenSSL); os dois falam com o crypto/tls do servidor.
module(load="omrelp")

# --- mensagens do proprio rsyslogd -> stdout (docker logs) ------------------
# Aqui aparecem os erros que o operador precisa ver: "could not connect" e a
# acao "suspended"/"resumed" (servidor fora ou sessao fechada: o rsyslog
# reconecta e retransmite), e "peer sent error response" seguido de "librelp
# error 10020" (um `500`, raro: aquela mensagem foi DESTRUIDA na origem, a
# sessao quebrou e as vizinhas da janela voltam como duplicatas). Nao vao pelo
# RELP: um erro do RELP mandado pelo proprio RELP so' daria voltas, e o `stop`
# abaixo e o filtro de facility da acao garantem isso.
template(name="console" type="string"
         string="%timegenerated:::date-rfc3339% %syslogtag%%msg:::drop-last-lf%\n")
if $programname == "rsyslogd" or $syslogtag startswith "rsyslogd" then {
  action(type="omfile" file="/dev/stdout" template="console")
  stop
}

# --- acao RELP: em claro (listen.tcp, porta 20514 do container) --------------
# So' a facility de teste (local0, a do demo.sh). Uma acao que manda tudo
# (*.*) num rsyslog real manda tambem as mensagens do proprio rsyslogd (facility
# syslog), inclusive os erros do omrelp: filtre a facility, ou exclua syslog.*
# (`if $syslogfacility-text != "syslog" then`), conforme o que o emissor deve
# encaminhar.
if prifilt("local0.*") then {
action(
  type="omrelp"
  name="relp-loghub"
  # O host e a porta vem do env do container (compose.emitter.yml): `echo $X`
  # entre crases e' a unica expansao que o rsyslog faz numa constante.
  target=`echo $RELP_TARGET`
  port=`echo $RELP_PORT`
  # Padrao do omrelp (90 s): quanto o rsyslog espera uma resposta antes de
  # desistir da sessao. O relp.backpressure_timeout do servidor (30 s) fica
  # ABAIXO dele de proposito: com ring cheio o servidor fecha a sessao primeiro,
  # e o rsyslog retransmite (docs/SPEC.md §5.7).
  timeout="90"
  # Janela do cliente: transacoes sem resposta antes de o omrelp parar de
  # mandar. 128 e' o padrao do librelp e o relp.window do servidor.
  windowSize="128"
  # Formato da linha: o padrao do omrelp (RSYSLOG_ForwardFormat, RFC 3164 com
  # timestamp de alta precisao). Para RFC 5424, descomente:
  #template="RSYSLOG_SyslogProtocol23Format"

  # A fila que nao perde: LinkedList em RAM que transborda para disco
  # (disk-assisted, por ter queue.filename), gravada no shutdown e retomada no
  # boot seguinte. Sem fila propria, a acao rodaria na fila principal e um
  # servidor fora do ar seguraria o rsyslog inteiro.
  queue.type="LinkedList"
  queue.filename="relp-loghub"
  queue.size="100000"
  queue.maxDiskSpace="1g"
  queue.saveOnShutdown="on"
  # Retentar para sempre: sem isto (padrao 0) o rsyslog suspende a acao e
  # DESCARTA o que nao conseguiu entregar.
  action.resumeRetryCount="-1"
  # Segundos entre tentativas de reconexao (cresce com as falhas seguidas).
  action.resumeInterval="5"
)
}

