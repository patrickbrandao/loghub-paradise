# ring sem ring  ->  descarte (benchmark de transporte)
#
# Garantia: NENHUMA. A conversao roda na transacao, o envelope e' DESCARTADO e
#   o `200 OK` RELP sai em seguida (SPEC §10.8, §19: "qualquer + none" perde
#   tudo); sem semaforo de max_inflight (SPEC §9.6). Mede recepcao RELP,
#   conversao e serializacao sem ring e sem destino. Nao guarde log com isto.
#
#   docker compose -f compose.none-none.yml up -d --build
#   docker compose -f compose.none-none.yml -f compose.emitter.yml --profile demo up -d --build
#     (o mesmo, com o rsyslog de demonstracao mandando por omrelp)
#
# Publicado no host: RELP 20531 (RELPLOG_PORT), RELP/TLS 20631 quando ligado
# (RELPLOG_TLS_PORT), admin 127.0.0.1:9317 (RELPLOG_ADMIN_PORT). Defaults
# distintos por combinacao, e disjuntos dos do go-syslog-server, para que
# varias rodem lado a lado no mesmo host (README, "Portas").

name: rls-none-none

services:
  relplog:
    extends:
      file: common.yml
      service: rls-base
    container_name: rls-none-none
    # Vira o Hostname do go-loghub-ident (beacon) e precisa ser RFC 1123.
    hostname: rls-none-none
    environment:
      # --- ring: none --------------------------------------------------------
      RELPLOG_RING_MODE: none
      # Sem ring.max_inflight: com sink=none o semaforo e' dispensado (SPEC §9.6).
      RELPLOG_EMERGENCY_ENABLED: "false"

      # --- sink: none --------------------------------------------------------
      RELPLOG_SINK_TYPE: none

    ports:
      # As portas do container sao as padrao do RELP (SPEC §4.1): 20514 em claro
      # e 20515 para o TLS, que so' escuta com RELPLOG_LISTEN_TLS definido.
      - "${RELPLOG_PORT:-20531}:20514/tcp"
      - "${RELPLOG_TLS_PORT:-20631}:20515/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${RELPLOG_ADMIN_PORT:-9317}:9103"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) mora nele, e duas
      # replicas no mesmo volume publicariam o mesmo `from` (SPEC §16.6).
      # ./conf (as chaves recarregaveis) e ./tls vem de common.yml.
      - rls-data:/data

volumes:
  rls-data:
