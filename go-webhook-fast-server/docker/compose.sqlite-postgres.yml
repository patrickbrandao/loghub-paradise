# ring durável em disco  ->  descarga no PostgreSQL
#
# Retencao local maxima com destino compartilhado: o 200 so' sai depois do
# COMMIT com fsync no ring.db, entao uma queda abrupta do processo nao perde
# nada -- o backlog e' drenado no boot seguinte, antes de a porta publica
# abrir. O dreno insere no PostgreSQL em lotes, com ON CONFLICT (uuid) DO NOTHING.
#
# Cada evento paga um fsync local E o commit sincrono do banco. E' a
# combinacao para quando o banco pode ficar indisponivel por longos periodos e
# nada pode ser perdido nem recusado nesse intervalo: a fila local absorve.
#
# O servidor NUNCA cria a tabela (docs/SPEC.md 8.5.1); ./postgres/inbox.sql e'
# aplicado pela imagem oficial na criacao do volume e validado no boot.
#
#   docker compose -f compose.sqlite-postgres.yml up -d --build

name: whf-sqlite-postgres

services:
  webhook:
    extends:
      file: common.yml
      service: whf-base
    container_name: whf-sqlite-postgres
    # O HOSTNAME do go-loghub-ident (SPEC §3.5): sem ele seria o id do
    # container, que muda a cada recriacao.
    hostname: whf-sqlite-postgres

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      # --- ring: sqlite -----------------------------------------------------
      WHS_RING_MODE: sqlite
      # Vazio deriva <data_dir>/ring.db; explicito para deixar obvio o que
      # precisa estar no volume.
      WHS_RING_SQLITE_PATH: /data/ring.db
      # FULL sobrevive a queda de energia e amarra o p99 ao disco.
      WHS_RING_SQLITE_SYNCHRONOUS: ${WHS_RING_SQLITE_SYNCHRONOUS:-FULL}
      WHS_RING_SQLITE_COMMIT_BATCH: ${WHS_RING_SQLITE_COMMIT_BATCH:-256}
      WHS_RING_SQLITE_COMMIT_MAX_DELAY: ${WHS_RING_SQLITE_COMMIT_MAX_DELAY:-5ms}
      WHS_RING_CAPACITY_ITEMS: ${WHS_RING_CAPACITY_ITEMS:-65536}
      WHS_RING_MAX_BYTES: ${WHS_RING_MAX_BYTES:-512MiB}
      WHS_RING_HIGH_WATER: ${WHS_RING_HIGH_WATER:-0.80}
      # Sem efeito com ring=sqlite: os itens ja' estao em disco.
      WHS_EMERGENCY_ENABLED: "false"

      # --- sink: postgres ---------------------------------------------------
      WHS_SINK_TYPE: postgres
      WHS_SINK_POSTGRES_ADDR: postgres:5432
      WHS_SINK_POSTGRES_USERNAME: ${WHS_SINK_POSTGRES_USERNAME:-webhook}
      WHS_SINK_POSTGRES_PASSWORD: ${WHS_SINK_POSTGRES_PASSWORD:-webhook}
      WHS_SINK_POSTGRES_DATABASE: ${WHS_SINK_POSTGRES_DATABASE:-webhook}
      WHS_SINK_POSTGRES_TABLE: ${WHS_SINK_POSTGRES_TABLE:-loghub.inbox}
      WHS_SINK_POSTGRES_POOL_SIZE: ${WHS_SINK_POSTGRES_POOL_SIZE:-0}
      WHS_SINK_POSTGRES_TLS: ${WHS_SINK_POSTGRES_TLS:-false}

      WHS_SINK_WORKERS: ${WHS_SINK_WORKERS:-4}
      WHS_SINK_BATCH: ${WHS_SINK_BATCH:-256}
      WHS_SINK_BATCH_MAX_DELAY: ${WHS_SINK_BATCH_MAX_DELAY:-5ms}
      WHS_SINK_OP_TIMEOUT: ${WHS_SINK_OP_TIMEOUT:-5s}

    ports:
      - "${WHS_HTTP_PORT:-8090}:8080"
      - "127.0.0.1:${WHS_ADMIN_PORT:-9120}:9101"

    # /data guarda o ring.db, a fonte da verdade desta combinacao.
    volumes:
      - whf-data:/data

  postgres:
    image: ${WHS_POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: whf-sqlite-postgres-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WHS_SINK_POSTGRES_USERNAME:-webhook}
      POSTGRES_PASSWORD: ${WHS_SINK_POSTGRES_PASSWORD:-webhook}
      POSTGRES_DB: ${WHS_SINK_POSTGRES_DATABASE:-webhook}
    command:
      - postgres
      - -c
      - synchronous_commit=on
    volumes:
      # A imagem 18 guarda os dados em /var/lib/postgresql/18/docker e recusa
      # um volume montado no antigo /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
      - ./postgres/inbox.sql:/docker-entrypoint-initdb.d/001-inbox.sql:ro
    ports:
      - "127.0.0.1:${WHS_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WHS_SINK_POSTGRES_USERNAME:-webhook} -d ${WHS_SINK_POSTGRES_DATABASE:-webhook}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whf-data:
  postgres-data:
