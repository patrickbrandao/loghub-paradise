# ring na RAM  ->  publicacao num stream JetStream (NATS)
#
# Mesma forma da combinacao de referencia (memory-redis), com um stream
# JetStream como destino final. Aceitar o evento custa uma copia em memoria; o
# dreno publica em lote (PublishMsgAsync) e espera um PubAck por mensagem, com
# Nats-Msg-Id para que uma redelivery dentro da janela de desduplicacao do
# stream (10 min em ./nats/stream.json) nao duplique.
#
# O webhook NUNCA cria o stream (docs/SPEC.md 8.7.5): o servico nats-init o
# cria a partir de ./nats/stream.json uma vez, e o webhook valida no boot que
# ele existe, que o subject pertence a ele, que nao esta' selado e que o
# max_payload comporta o maior evento -- e sai com codigo 3 na hora se algo
# faltar, sem esperar sink.boot_timeout.
#
# Durabilidade: o PubAck significa que o stream gravou a mensagem conforme a
# configuracao DELE (storage file, replicas, sync_interval; SPEC 8.7.4). Um
# unico servidor com file store cobre a queda do processo; contra a queda do
# proprio nats-server, sync_always ou replicas. O dump de emergencia cobre o
# trecho em RAM.
#
#   docker compose -f compose.memory-nats.yml up -d --build

name: whf-memory-nats

services:
  webhook:
    extends:
      file: common.yml
      service: whf-base
    container_name: whf-memory-nats
    # O HOSTNAME do go-loghub-ident (SPEC §3.5): sem ele seria o id do
    # container, que muda a cada recriacao.
    hostname: whf-memory-nats

    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully

    environment:

      # --- ring: memoria ----------------------------------------------------
      WHS_RING_MODE: memory
      WHS_RING_CAPACITY_ITEMS: ${WHS_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): com ring=memory o teto de
      # bytes do ring fica todo na RAM e o boot avisa se GOMEMLIMIT for menor que
      # o dobro dele. Quem subir um, suba o outro junto (WHS_GOMEMLIMIT e
      # WHS_MEMORY_LIMIT).
      WHS_RING_MAX_BYTES: ${WHS_RING_MAX_BYTES:-256MiB}
      WHS_RING_HIGH_WATER: ${WHS_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL, o backlog vai para
      # /data/emergency e volta no boot seguinte.
      WHS_EMERGENCY_ENABLED: "true"

      # --- sink: nats -------------------------------------------------------
      WHS_SINK_TYPE: nats
      WHS_SINK_NATS_URLS: nats://nats:4222
      # Se trocar o nome do stream, troque tambem os subjects em ./nats/stream.json.
      WHS_SINK_NATS_STREAM: ${WHS_SINK_NATS_STREAM:-LOGHUB_WEBHOOK}
      WHS_SINK_NATS_SUBJECT: ${WHS_SINK_NATS_SUBJECT:-loghub.{space}.{type}}
      # Rede interna do compose: sem autenticacao nem TLS. Contra um NATS
      # gerenciado, monte um arquivo .creds em /etc/webhook (somente leitura) e
      # aponte WHS_SINK_NATS_CREDENTIALS para ele; ligue WHS_SINK_NATS_TLS.
      WHS_SINK_NATS_USERNAME: ${WHS_SINK_NATS_USERNAME:-}
      WHS_SINK_NATS_PASSWORD: ${WHS_SINK_NATS_PASSWORD:-}
      WHS_SINK_NATS_TLS: ${WHS_SINK_NATS_TLS:-false}

      # Uma conexao multiplexada por todos os workers: varios valem a pena,
      # como no Redis.
      WHS_SINK_WORKERS: ${WHS_SINK_WORKERS:-8}
      WHS_SINK_BATCH: ${WHS_SINK_BATCH:-256}
      WHS_SINK_BATCH_MAX_DELAY: ${WHS_SINK_BATCH_MAX_DELAY:-5ms}
      WHS_SINK_OP_TIMEOUT: ${WHS_SINK_OP_TIMEOUT:-5s}

    ports:
      - "${WHS_HTTP_PORT:-8092}:8080"
      - "127.0.0.1:${WHS_ADMIN_PORT:-9122}:9101"

    # /data so' para os dumps de emergencia -- e aqui eles sao esperados.
    volumes:
      - whf-data:/data

  nats:
    image: ${WHS_NATS_IMAGE:-nats:2.11-alpine}
    container_name: whf-memory-nats-nats
    restart: unless-stopped
    # A imagem oficial ja' roda `nats-server --config /etc/nats/nats-server.conf`;
    # o arquivo montado por cima liga o JetStream em /data e sobe max_payload
    # para 8 MB (ver ./nats/nats-server.conf).
    volumes:
      - nats-data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "127.0.0.1:${WHS_NATS_PORT:-4222}:4222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Cria o stream UMA vez, de forma idempotente: `stream info` responde se ele
  # ja' existe; senao `stream add` o cria a partir do arquivo canonico. Contra
  # um NATS de producao esse papel e' de quem administra o servidor -- o
  # webhook nunca cria nem altera um stream (docs/SPEC.md 8.7.5).
  nats-init:
    image: ${WHS_NATS_BOX_IMAGE:-natsio/nats-box:latest}
    container_name: whf-memory-nats-init
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./nats/stream.json:/etc/nats/stream.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        nats --server nats://nats:4222 stream info ${WHS_SINK_NATS_STREAM:-LOGHUB_WEBHOOK} >/dev/null 2>&1
        || nats --server nats://nats:4222 stream add ${WHS_SINK_NATS_STREAM:-LOGHUB_WEBHOOK} --config /etc/nats/stream.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whf-data:
  nats-data:
