# ring na RAM  ->  descarga no ClickHouse
#
# Mesma forma da combinacao de referencia (memory-redis), com um armazem
# analitico compartilhado por todas as instancias como destino final. Aceitar
# o evento custa uma copia em memoria; o dreno faz UM INSERT colunar por lote,
# com um insert_deduplication_token tirado dos uuids do lote, para que o retry
# de um lote nunca duplique (docs/SPEC.md 8.8.4).
#
# O servidor NUNCA cria a tabela (docs/SPEC.md 8.8.5). O init.sh aplica
# ./clickhouse/inbox.sql uma vez, na criacao do volume, dentro de
# CLICKHOUSE_DB; o webhook valida no boot a versao, o motor, a chave, as
# colunas, os hints do payload, o limite de memoria e um INSERT vazio de sonda,
# e sai com codigo 3 na hora se algo faltar.
#
# Durabilidade: o evento so' existe na RAM ate' o INSERT responder, e o que
# "respondido" significa e' o perfil do usuario no ClickHouse (async_insert,
# wait_for_async_insert -- SPEC 8.8.6), que o webhook nao le nem altera. O
# dump de emergencia cobre o trecho em RAM.
#
# Conexoes: cada worker segura uma conexao, e cada INSERT e' uma parte que o
# servidor precisa fundir. Por isso o padrao aqui e' 4 workers (SPEC 8.8.2).
#
#   docker compose -f compose.memory-clickhouse.yml up -d --build

name: whf-memory-clickhouse

services:
  webhook:
    extends:
      file: common.yml
      service: whf-base
    container_name: whf-memory-clickhouse
    # O HOSTNAME do go-loghub-ident (SPEC §3.5): sem ele seria o id do
    # container, que muda a cada recriacao.
    hostname: whf-memory-clickhouse

    depends_on:
      clickhouse:
        condition: service_healthy

    environment:

      # --- ring: memoria ----------------------------------------------------
      WHS_RING_MODE: memory
      WHS_RING_CAPACITY_ITEMS: ${WHS_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): com ring=memory o teto de
      # bytes do ring fica todo na RAM e o boot avisa se GOMEMLIMIT for menor que
      # o dobro dele. Quem subir um, suba o outro junto (WHS_GOMEMLIMIT e
      # WHS_MEMORY_LIMIT).
      WHS_RING_MAX_BYTES: ${WHS_RING_MAX_BYTES:-256MiB}
      WHS_RING_HIGH_WATER: ${WHS_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL, o backlog vai para
      # /data/emergency e volta no boot seguinte.
      WHS_EMERGENCY_ENABLED: "true"

      # --- sink: clickhouse -------------------------------------------------
      WHS_SINK_TYPE: clickhouse
      # Protocolo nativo (9000; 9440 com TLS), nao o HTTP (8123).
      WHS_SINK_CLICKHOUSE_ADDRS: clickhouse:9000
      WHS_SINK_CLICKHOUSE_USERNAME: ${WHS_SINK_CLICKHOUSE_USERNAME:-webhook}
      # A senha padrao serve ao ambiente de desenvolvimento. Em producao, .env.
      WHS_SINK_CLICKHOUSE_PASSWORD: ${WHS_SINK_CLICKHOUSE_PASSWORD:-webhook}
      WHS_SINK_CLICKHOUSE_DATABASE: ${WHS_SINK_CLICKHOUSE_DATABASE:-webhook}
      WHS_SINK_CLICKHOUSE_TABLE: ${WHS_SINK_CLICKHOUSE_TABLE:-inbox}
      # 0 deriva sink.workers + 1: uma conexao por worker e uma de folga (o health tem a sua, fora do pool).
      WHS_SINK_CLICKHOUSE_POOL_SIZE: ${WHS_SINK_CLICKHOUSE_POOL_SIZE:-0}
      # Rede interna do compose: sem TLS. Contra um servidor gerenciado, ligue
      # WHS_SINK_CLICKHOUSE_TLS (porta 9440) e monte a CA em /etc/webhook.
      WHS_SINK_CLICKHOUSE_TLS: ${WHS_SINK_CLICKHOUSE_TLS:-false}
      WHS_SINK_CLICKHOUSE_TLS_CA: ${WHS_SINK_CLICKHOUSE_TLS_CA:-}

      # Explicito para nao emitir o aviso de padrao rebaixado. Cada worker e'
      # uma conexao e um INSERT por vez; o ClickHouse prefere lotes grandes.
      WHS_SINK_WORKERS: ${WHS_SINK_WORKERS:-4}
      WHS_SINK_BATCH: ${WHS_SINK_BATCH:-256}
      WHS_SINK_BATCH_MAX_BYTES: ${WHS_SINK_BATCH_MAX_BYTES:-16MiB}
      WHS_SINK_BATCH_MAX_DELAY: ${WHS_SINK_BATCH_MAX_DELAY:-5ms}
      WHS_SINK_OP_TIMEOUT: ${WHS_SINK_OP_TIMEOUT:-5s}

    ports:
      - "${WHS_HTTP_PORT:-8098}:8080"
      - "127.0.0.1:${WHS_ADMIN_PORT:-9128}:9101"

    # /data so' para os dumps de emergencia -- e aqui eles sao esperados.
    volumes:
      - whf-data:/data

  clickhouse:
    image: ${WHS_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    container_name: whf-memory-clickhouse-clickhouse
    restart: unless-stopped
    environment:
      # A imagem cria o banco e o usuario. O mesmo usuario serve ao webhook
      # neste ambiente de desenvolvimento; em producao ele precisa so' de
      # INSERT na tabela e de um perfil com readonly = 0 (SPEC 8.8.5).
      CLICKHOUSE_DB: ${WHS_SINK_CLICKHOUSE_DATABASE:-webhook}
      CLICKHOUSE_USER: ${WHS_SINK_CLICKHOUSE_USERNAME:-webhook}
      CLICKHOUSE_PASSWORD: ${WHS_SINK_CLICKHOUSE_PASSWORD:-webhook}
    # async_insert, wait_for_async_insert e fsync_after_insert ficam no padrao
    # da imagem (async_insert = 0): a garantia do 200 com ring=none mora no
    # perfil do usuario, e o webhook nao a le nem altera (SPEC 8.8.6).
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # inbox.sql fica fora do initdb.d: a imagem rodaria um .sql de la' no
      # banco default. O init.sh o aplica UMA vez, na criacao do volume,
      # dentro de CLICKHOUSE_DB. Depois disso o esquema e' seu.
      - ./clickhouse/inbox.sql:/etc/whs/inbox.sql:ro
      - ./clickhouse/init.sh:/docker-entrypoint-initdb.d/001-inbox.sh:ro
    ports:
      - "127.0.0.1:${WHS_CLICKHOUSE_PORT:-9000}:9000"
    healthcheck:
      # Saudavel so' quando a TABELA existe: o servidor responde antes de o
      # init.sh terminar, e o webhook sairia com 3 numa tabela ausente.
      test: ["CMD-SHELL", "test \"$$(clickhouse-client -u $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} -q \"EXISTS TABLE $${CLICKHOUSE_DB}.inbox\")\" = 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whf-data:
  clickhouse-data:
