# go-syslog-nats-server: ring na RAM -> NATS JetStream (loghub.<space>.syslog).
#
#   cd docker && docker compose up -d --build
#
# A unica combinacao (SPEC §2.1). Sobe o servidor, um nats-server com JetStream
# e o job nats-init, que cria o stream LOGHUB_SYSLOG a partir de
# nats/stream.json. O heartbeat beacon sai em loghub._ctl.beacon por NATS core.
#
# Garantia (TCP): a mensagem esta' na RAM deste no'. SIGTERM nao perde (dreno);
# FATAL do NATS nao perde (dump JSON Lines em /data/emergency, reingerido no
# boot seguinte); SIGKILL e OOM perdem o backlog (SPEC §19). Depois do PubAck,
# a durabilidade e' a do stream.
#
# SEM TLS (SPEC §1.2): o cliente NATS e' sempre texto claro, nats:// e so'.
#
# Publicado no host, com defaults que nao colidem com os compose do
# go-syslog-server (5141-5162, 19101-19122) nem com o do go-syslog-pg-server
# (5180, 19180, 15480): syslog 5181/udp e 5181/tcp (SYSLOG_PORT), admin
# 127.0.0.1:19181 (SYSLOG_ADMIN_PORT), cliente NATS 127.0.0.1:14281
# (SYSLOG_NATS_PORT), monitor do NATS 127.0.0.1:18281 (SYSLOG_NATS_MONITOR_PORT).

name: slnats

services:
  syslog:
    extends:
      file: common.yml
      service: slnats-base
    container_name: slnats
    # Vira o Hostname do go-loghub-ident: o `hostname` do beacon e o nome do
    # cliente NATS slnats/<AgentName>@<Hostname> no connz; precisa ser RFC 1123.
    hostname: slnats
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      # --- ring: memory (o unico; nao ha SYSLOG_RING_MODE) --------------------
      SYSLOG_RING_CAPACITY_ITEMS: ${SYSLOG_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): o boot avisa se GOMEMLIMIT
      # for menor que o dobro (SPEC §15.4). Quem subir um sobe o outro.
      SYSLOG_RING_MAX_BYTES: ${SYSLOG_RING_MAX_BYTES:-256MiB}
      SYSLOG_RING_HIGH_WATER: ${SYSLOG_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL ou dreno estourado despeja o
      # backlog em /data/emergency/emg-*.jsonl, um JLH por linha (SPEC §12).
      SYSLOG_EMERGENCY_ENABLED: "true"

      # --- sink: NATS (o unico; nao ha SYSLOG_SINK_TYPE) ----------------------
      # 8 workers dividem UMA conexao NATS (SPEC §10.1).
      SYSLOG_SINK_WORKERS: ${SYSLOG_SINK_WORKERS:-8}
      # jetstream: PubAck por mensagem e deduplicacao por Nats-Msg-Id. core:
      # best effort, o boot avisa (WARN) -- sem stream, mensagem sem assinante
      # some.
      SYSLOG_SINK_NATS_MODE: ${SYSLOG_SINK_NATS_MODE:-jetstream}
      # Validado no boot, nunca criado (SPEC §10.7): o nats-init abaixo o cria.
      SYSLOG_SINK_NATS_STREAM: ${SYSLOG_SINK_NATS_STREAM:-LOGHUB_SYSLOG}
      # Heartbeat beacon em loghub._ctl.beacon a cada 15 s; 0 desliga so' o
      # periodico, nao o de conexao (SPEC §11).
      LOGHUB_BEACON_INTERVAL: ${LOGHUB_BEACON_INTERVAL:-15}
      # Conexao, SEM TLS: so' nats:// (tls://, ws://, wss:// sao exit 1, e um
      # nats-server que exige TLS e' exit 3 no boot). O NATS precisa estar numa
      # rede confiavel -- aqui, a rede interna do compose.
      # Estas quatro sao as chaves "donas" do LOGHUB_EB_URL (SPEC §10.9). Para
      # usar a URL no lugar delas, apague as quatro linhas abaixo e descomente a
      # LOGHUB_EB_URL (README). As sem valor so' entram se definidas no .env ou
      # no shell: vazias contariam como explicitas e travariam a URL.
      SYSLOG_SINK_NATS_URLS: nats://nats:4222
      SYSLOG_SINK_NATS_USERNAME:
      SYSLOG_SINK_NATS_PASSWORD:
      SYSLOG_SINK_NATS_TOKEN:
      #LOGHUB_EB_URL: ${LOGHUB_EB_URL:?defina LOGHUB_EB_URL no .env ou no shell}

    ports:
      # SYSLOG_PORT do host na 1514 do container: a imagem nao abre porta privilegiada.
      - "${SYSLOG_PORT:-5181}:1514/udp"
      - "${SYSLOG_PORT:-5181}:1514/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${SYSLOG_ADMIN_PORT:-19181}:9102"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) e os dumps moram
      # nele, e duas replicas no mesmo volume publicariam o mesmo `from`
      # (SPEC §16.6). ./conf (as chaves recarregaveis) vem de common.yml.
      - slnats-data:/data

  nats:
    image: ${SYSLOG_NATS_IMAGE:-nats:2.11-alpine}
    container_name: slnats-nats
    hostname: slnats-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - slnats-nats-data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      # Cliente e monitor so' no loopback do host: para o `nats` CLI e o connz.
      - "127.0.0.1:${SYSLOG_NATS_PORT:-14281}:4222"
      - "127.0.0.1:${SYSLOG_NATS_MONITOR_PORT:-18281}:8222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Job de uma vez: cria o stream a partir do arquivo que o operador aplica; o
  # syslog so' o valida (nunca cria nem altera um stream, SPEC §10.7). Se o
  # stream ja' existe (o volume do NATS sobreviveu), nada muda: um stream
  # existente com outra config continua a ser validado pelo syslog no boot.
  nats-init:
    image: ${SYSLOG_NATS_BOX_IMAGE:-natsio/nats-box:0.20.0}
    container_name: slnats-nats-init
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./nats/stream.json:/etc/nats/stream.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        nats --server nats://nats:4222 stream info ${SYSLOG_SINK_NATS_STREAM:-LOGHUB_SYSLOG} >/dev/null 2>&1
        || nats --server nats://nats:4222 stream add ${SYSLOG_SINK_NATS_STREAM:-LOGHUB_SYSLOG} --config /etc/nats/stream.json

volumes:
  slnats-data:
  slnats-nats-data:
