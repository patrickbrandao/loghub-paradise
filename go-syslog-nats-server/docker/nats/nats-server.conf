# nats-server do docker-compose.yml do go-syslog-nats-server.
#
# SEM TLS, como o resto deste servidor (docs/SPEC.md §1.2): o cliente e' sempre
# texto claro, e um nats-server com `tls {}` (tls_required no INFO) e' recusado
# no boot com exit 3, sem nenhum handshake. Use uma rede confiavel -- aqui, a
# rede interna do compose.
#
# max_payload conta headers e dados de cada mensagem. O pior JLH deste servidor
# e' 12 x syslog.max_message_bytes + 8 KiB: 776 KiB com o padrao de 64 KiB
# (docs/SPEC.md §3.9), mais ate' ~300 B de headers, e o boot sai com codigo 3
# se a maior mensagem nao couber. O 1 MiB padrao do nats-server basta; ele fica
# explicito aqui para que quem suba SYSLOG_MAX_MESSAGE_BYTES acima de 84 KiB
# saiba o que subir junto.
#
# O stream LOGHUB_SYSLOG NAO e' criado pelo syslog: o servico nats-init do
# compose o cria a partir de stream.json, e o syslog so' o valida no boot
# (docs/SPEC.md §10.7). O plano de controle (loghub._ctl.beacon) nao vai para
# stream nenhum: e' fanout por NATS core.
port: 4222
# Monitor HTTP: /healthz (healthcheck do compose), /connz (o cliente aparece
# como slnats/<AgentName>@<Hostname>), /jsz.
http_port: 8222
max_payload: 1MB

jetstream {
  store_dir: /data
}
