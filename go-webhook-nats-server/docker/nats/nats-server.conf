# nats-server do docker-compose.yml do go-webhook-nats-server.
#
# SEM TLS, como o resto deste servidor (docs/SPEC.md 8.7.9): o cliente e'
# sempre texto claro, e um nats-server com `tls {}` (tls_required no INFO) e'
# recusado no boot com exit 3, sem nenhum handshake. Use uma rede confiavel --
# aqui, a rede interna do compose.
#
# max_payload conta headers e corpo de cada mensagem. O padrao do nats-server
# e' 1 MiB, abaixo do maior envelope dos padroes do webhook (5 MiB de corpo
# viram ~7,7 MiB de envelope, docs/SPEC.md 3.2): o webhook recusaria o boot com
# codigo 3 (8.7.5), porque aceitar um corpo que depois nao cabe no stream seria
# descartar evento ja' confirmado. 8 MB cobre o envelope maximo mais os
# headers; acima de 8 MB o nats-server so' avisa, e o file store recusa
# registros acima de 32 MiB. Quem subir server.max_body_bytes sobe isto junto.
#
# O stream LOGHUB_WEBHOOK NAO e' criado pelo webhook: o servico nats-init do
# compose o cria a partir de stream.json, e o webhook so' o valida no boot. O
# plano de controle (loghub._ctl.beacon) nao vai para stream nenhum: e' fanout
# por NATS core.
port: 4222
# Monitor HTTP: /healthz (healthcheck do compose), /connz (o cliente aparece
# como whs/<AgentName>@<Hostname>), /jsz.
http_port: 8222
max_payload: 8MB

jetstream {
  store_dir: /data
}
