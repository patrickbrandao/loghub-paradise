# go-gelf-nats-server -- as chaves RECARREGAVEIS por SIGHUP (docs/SPEC.md §16.3).
#
# O compose monta esta pasta so' leitura em /etc/gelf (common.yml) e aponta
# GELF_CONFIG para /etc/gelf/gelf.ini. Para mudar sem reiniciar:
#
#   1. edite este arquivo no host;
#   2. docker kill -s HUP gelf-nats
#   3. confira no log: "SIGHUP: applied" com as chaves trocadas.
#
# Um valor invalido nao derruba nada: o log diz que a nova configuracao e'
# invalida e NAO foi aplicada, e o servidor segue com a anterior.
#
# Por que um arquivo e nao env: env vence o INI (SPEC §16.1), e o env de um
# container nao muda depois do `up`. Uma chave recarregavel definida por env
# nunca mudaria com o HUP. Por isso NENHUM arquivo deste diretorio (common.yml,
# docker-compose.yml, .env.example) define estas chaves por env; nao as
# acrescente la'.
#
# So' as chaves recarregaveis moram aqui. Nao ponha chaves de restart (listen,
# ring, sink, [convert]...): elas ficam no env do compose. E nao ponha secoes
# e chaves do go-gelf-server que nao existem aqui ([filter], [ratelimit],
# [tls], listen.https, [sink.postgres], sink.nats.tls...): parametro
# desconhecido e' exit 1 no boot, e um SIGHUP com elas e' recusado inteiro.
#
# Sintaxe: `chave = valor`; comentario so' em linha inteira (# ou ;). Os
# valores abaixo sao os padroes do registry (internal/config/registry.go,
# SPEC §16.5).

[log]
# Nivel do log do proprio servidor: debug | info | warn | error.
level = info
# Log por documento recebido, amostrado: aqui isso e' literalmente logar log.
access = false
# Fracao dos documentos logados quando access = true, em [0, 1].
access_sample = 0.01
