# go-gelf-nats-server: ring na RAM -> NATS JetStream (loghub.<space>.gelf).
#
#   cd docker && docker compose up -d --build
#   docker compose --profile demo up -d --build     # + emissor GELF fluent-bit
#
# A unica combinacao (SPEC §2.1). Sobe o servidor, um nats-server com JetStream
# e o job nats-init, que cria o stream LOGHUB_GELF a partir de
# nats/stream.json. O heartbeat beacon sai em loghub._ctl.beacon por NATS core.
# Com o perfil "demo", o fluent-bit (fluent-bit/) manda GELF por UDP (gzip,
# chunked) e por TCP.
#
# Garantia (TCP): o documento esta' na RAM deste no'. HTTP: o 202 sai depois
# disso. SIGTERM nao perde (dreno); FATAL do NATS nao perde (dump JSON Lines em
# /data/emergency, reingerido no boot seguinte); SIGKILL e OOM perdem o
# backlog (SPEC §19). Depois do PubAck, a durabilidade e' a do stream.
#
# SEM TLS (SPEC §1.2): nem nos listeners, nem ate' o NATS (nats:// e so').
#
# Publicado no host, com defaults que nao colidem com os compose do
# go-gelf-server (12201-12204, 22011+, 29101+) nem com o do go-gelf-pg-server
# (GELF 12301/udp e 12301/tcp, HTTP 12302, admin 19304, PostgreSQL 15494):
# GELF 12281/udp e 12281/tcp (GELF_PORT), HTTP 12282
# (GELF_HTTP_PORT), admin 127.0.0.1:19281 (GELF_ADMIN_PORT), cliente NATS
# 127.0.0.1:14291 (GELF_NATS_PORT), monitor do NATS 127.0.0.1:18291
# (GELF_NATS_MONITOR_PORT).

name: gelf-nats

services:
  gelf:
    extends:
      file: common.yml
      service: gelf-nats-base
    container_name: gelf-nats
    # Vira o Hostname do go-loghub-ident: o `hostname` do beacon e o nome do
    # cliente NATS glnats/<AgentName>@<Hostname> no connz; precisa ser RFC 1123.
    hostname: gelf-nats
    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
    environment:
      # --- ring: memory (o unico; nao ha GELF_RING_MODE) ----------------------
      GELF_RING_CAPACITY_ITEMS: ${GELF_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): o boot avisa se GOMEMLIMIT
      # for menor que o dobro (SPEC §15.4). Quem subir um sobe o outro.
      GELF_RING_MAX_BYTES: ${GELF_RING_MAX_BYTES:-256MiB}
      GELF_RING_HIGH_WATER: ${GELF_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL ou dreno estourado despeja o
      # backlog em /data/emergency/emg-*.jsonl, um JLH por linha (SPEC §12).
      GELF_EMERGENCY_ENABLED: "true"

      # --- sink: NATS (o unico; nao ha GELF_SINK_TYPE) ------------------------
      # 8 workers dividem UMA conexao NATS (SPEC §10.1).
      GELF_SINK_WORKERS: ${GELF_SINK_WORKERS:-8}
      # jetstream: PubAck por mensagem e deduplicacao por Nats-Msg-Id. core:
      # best effort, o boot avisa (WARN) -- sem stream, mensagem sem assinante
      # some.
      GELF_SINK_NATS_MODE: ${GELF_SINK_NATS_MODE:-jetstream}
      # Validado no boot, nunca criado (SPEC §10.7): o nats-init abaixo o cria.
      GELF_SINK_NATS_STREAM: ${GELF_SINK_NATS_STREAM:-LOGHUB_GELF}
      # Heartbeat beacon em loghub._ctl.beacon a cada 15 s; 0 desliga so' o
      # periodico, nao o de conexao (SPEC §11).
      LOGHUB_BEACON_INTERVAL: ${LOGHUB_BEACON_INTERVAL:-15}
      # Conexao, SEM TLS: so' nats:// (tls://, ws://, wss:// sao exit 1, e um
      # nats-server que exige TLS e' exit 3 no boot). O NATS precisa estar numa
      # rede confiavel -- aqui, a rede interna do compose.
      # Estas quatro sao as chaves "donas" do LOGHUB_EB_URL (SPEC §10.9). Para
      # usar a URL no lugar delas, apague as quatro linhas abaixo e descomente a
      # LOGHUB_EB_URL (README). As sem valor so' entram se definidas no .env ou
      # no shell: vazias contariam como explicitas e travariam a URL.
      GELF_SINK_NATS_URLS: nats://nats:4222
      GELF_SINK_NATS_USERNAME:
      GELF_SINK_NATS_PASSWORD:
      GELF_SINK_NATS_TOKEN:
      #LOGHUB_EB_URL: ${LOGHUB_EB_URL:?defina LOGHUB_EB_URL no .env ou no shell}

    ports:
      # As portas GELF do container, publicadas em portas do host que nao
      # colidem com as do go-gelf-server. Para receber nas portas padrao,
      # GELF_PORT=12201 e GELF_HTTP_PORT=12202.
      - "${GELF_PORT:-12281}:12201/udp"
      - "${GELF_PORT:-12281}:12201/tcp"
      - "${GELF_HTTP_PORT:-12282}:12202/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${GELF_ADMIN_PORT:-19281}:9104"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) e os dumps moram
      # nele, e duas replicas no mesmo volume publicariam o mesmo `from`
      # (SPEC §16.6). ./conf (as chaves recarregaveis) vem de common.yml.
      - gelf-nats-data:/data

  nats:
    image: ${GELF_NATS_IMAGE:-nats:2.11-alpine}
    container_name: gelf-nats-nats
    hostname: gelf-nats-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - gelf-nats-nats-data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      # Cliente e monitor so' no loopback do host: para o `nats` CLI e o connz.
      - "127.0.0.1:${GELF_NATS_PORT:-14291}:4222"
      - "127.0.0.1:${GELF_NATS_MONITOR_PORT:-18291}:8222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Job de uma vez: cria o stream a partir do arquivo que o operador aplica; o
  # servidor GELF so' o valida (nunca cria nem altera um stream, SPEC §10.7).
  # Se o stream ja' existe (o volume do NATS sobreviveu), nada muda.
  nats-init:
    image: ${GELF_NATS_BOX_IMAGE:-natsio/nats-box:0.20.0}
    container_name: gelf-nats-nats-init
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./nats/stream.json:/etc/nats/stream.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        nats --server nats://nats:4222 stream info ${GELF_SINK_NATS_STREAM:-LOGHUB_GELF} >/dev/null 2>&1
        || nats --server nats://nats:4222 stream add ${GELF_SINK_NATS_STREAM:-LOGHUB_GELF} --config /etc/nats/stream.json

  # Emissor GELF de demonstracao (perfil "demo": nunca sobe sem ser pedido):
  # fluent-bit com duas saidas gelf (fluent-bit/fluent-bit.conf).
  #   - UDP com gzip e Packet_Size 1420, registro de ~12 KiB aleatorio: chega em
  #     varios chunks GELF e prova remontagem + descompressao (SPEC §5.2, §5.4);
  #   - TCP com moldura \0, registro pequeno (SPEC §5.3).
  # O que chega aparece no stream: `nats --server nats://127.0.0.1:14291 stream
  # view LOGHUB_GELF` (payload.chunks > 1 e payload.compression = "gzip" nos de
  # UDP). O `docker run --log-driver=gelf` nao roda dentro de um compose de forma
  # util (README, "Emissores de demonstracao").
  fluent-bit:
    image: ${GELF_FLUENT_BIT_IMAGE:-fluent/fluent-bit:4.0.3}
    container_name: gelf-nats-fluent-bit
    profiles: ["demo"]
    restart: unless-stopped
    depends_on:
      gelf:
        condition: service_healthy
    environment:
      GELF_DEMO_HOST: gelf
      # Um registro por saida a cada N segundos.
      GELF_DEMO_INTERVAL: ${GELF_DEMO_INTERVAL:-5}
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/gelf-demo.conf"]
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/gelf-demo.conf:ro
      - ./fluent-bit/gelf-demo.lua:/fluent-bit/etc/gelf-demo.lua:ro

volumes:
  gelf-nats-data:
  gelf-nats-nats-data:
