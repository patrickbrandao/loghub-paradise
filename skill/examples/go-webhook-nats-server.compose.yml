name: loghub-demo-go-webhook-nats-server

services:
  receiver:
    image: tmsoftbrasil/go-webhook-nats-server:${LOGHUB_TAG:-sha-7e2694f821af}
    read_only: true
    stop_grace_period: 45s
    environment:
      WHS_SERVER_BIND: "0.0.0.0:8080"
      WHS_ADMIN_ENABLED: "true"
      WHS_ADMIN_BIND: "0.0.0.0:9101"
      WHS_SINK_NATS_URLS: "nats://nats:4222"
      WHS_SINK_NATS_MODE: "jetstream"
      WHS_SINK_NATS_STREAM: "LOGHUB_WEBHOOK"
    depends_on:
      nats-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:18083:8080/tcp"
      - "127.0.0.1:19131:9101/tcp"
    volumes:
      - receiver-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9101/readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  teste:
    image: tmsoftbrasil/go-webhook-injector:${LOGHUB_TAG:-sha-7e2694f821af}
    profiles: ["teste"]
    depends_on:
      receiver:
        condition: service_healthy
    command:
      - "--url"
      - "http://receiver:8080/hook"
      - "--count"
      - "10"
      - "--verify-url"
      - "nats://nats:4222"
      - "--verify-stream"
      - "LOGHUB_WEBHOOK"
      - "--verify-timeout"
      - "15s"

  nats:
    image: nats:2.11-alpine
    command: ["-c", "/nats.conf"]
    configs:
      - source: nats-config
        target: /nats.conf
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20

  nats-init:
    image: natsio/nats-box:0.20.0
    depends_on:
      nats:
        condition: service_healthy
    configs:
      - source: stream-json
        target: /stream.json
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        nats --server nats://nats:4222 stream info LOGHUB_WEBHOOK >/dev/null 2>&1 ||
        nats --server nats://nats:4222 stream add LOGHUB_WEBHOOK --config /stream.json

volumes:
  receiver-data:
  nats-data:

configs:
  nats-config:
    content: |
      port: 4222
      http_port: 8222
      max_payload: 8MB
      jetstream {
        store_dir: /data
      }
  stream-json:
    content: |
      {
        "name": "LOGHUB_WEBHOOK",
        "subjects": [
          "loghub.default.webhook"
        ],
        "retention": "limits",
        "storage": "file",
        "num_replicas": 1,
        "max_consumers": -1,
        "max_msgs": -1,
        "max_msgs_per_subject": -1,
        "max_bytes": 134217728,
        "max_age": 0,
        "max_msg_size": -1,
        "duplicate_window": 600000000000,
        "discard": "old",
        "no_ack": false,
        "sealed": false,
        "deny_delete": false,
        "deny_purge": false
      }
