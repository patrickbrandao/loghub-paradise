name: loghub-demo-go-gelf-injector

services:
  receiver:
    image: tmsoftbrasil/go-gelf-server:${LOGHUB_TAG:-sha-7e2694f821af}
    read_only: true
    stop_grace_period: 45s
    environment:
      GELF_LISTEN_TCP: "0.0.0.0:12201"
      GELF_LISTEN_UDP: "0.0.0.0:12201"
      GELF_LISTEN_HTTP: "0.0.0.0:12202"
      GELF_ADMIN_ENABLED: "true"
      GELF_ADMIN_BIND: "0.0.0.0:9104"
      GELF_RING_MODE: "memory"
      GELF_SINK_TYPE: "sqlite"
      GELF_SINK_SQLITE_PATH: "/data/events.db"
    volumes:
      - receiver-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9104/readyz"]
      interval: 2s
      timeout: 2s
      retries: 20

  injector:
    image: tmsoftbrasil/go-gelf-injector:${LOGHUB_TAG:-sha-7e2694f821af}
    depends_on:
      receiver:
        condition: service_healthy
    volumes:
      - receiver-data:/dados
    command:
      - "--transport"
      - "http"
      - "--target"
      - "receiver:12202"
      - "--count"
      - "10"
      - "--verify-sqlite"
      - "/dados/events.db"
      - "--verify-timeout"
      - "15s"

volumes:
  receiver-data:
