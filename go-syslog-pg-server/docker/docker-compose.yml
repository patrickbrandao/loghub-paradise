# go-syslog-pg-server: ring na RAM -> PostgreSQL (fila loghub.inbox).
#
#   cd docker && docker compose up -d --build
#
# A unica combinacao (SPEC §2.1). Sobe o servidor e um PostgreSQL 18 com a fila
# criada a partir de postgres/inbox.sql.
#
# Garantia (TCP): a mensagem esta' na RAM deste no'. SIGTERM nao perde (dreno);
# FATAL do banco nao perde (dump JSON Lines em /data/emergency, reingerido no
# boot seguinte); SIGKILL e OOM perdem o backlog (SPEC §19).
#
# Publicado no host, com defaults que nao colidem com os compose do
# go-syslog-server: syslog 5180/udp e 5180/tcp (SYSLOG_PORT), admin
# 127.0.0.1:19180 (SYSLOG_ADMIN_PORT), PostgreSQL 127.0.0.1:15480
# (SYSLOG_POSTGRES_PORT).

name: slpg

services:
  syslog:
    extends:
      file: common.yml
      service: slpg-base
    container_name: slpg
    # Vira o Hostname do go-loghub-ident (e o application_name
    # slpg/<AgentName>@<Hostname> no PostgreSQL); precisa ser RFC 1123.
    hostname: slpg
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- ring: memory (o unico; nao ha SYSLOG_RING_MODE) --------------------
      SYSLOG_RING_CAPACITY_ITEMS: ${SYSLOG_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): o boot avisa se GOMEMLIMIT
      # for menor que o dobro (SPEC §15.4). Quem subir um sobe o outro.
      SYSLOG_RING_MAX_BYTES: ${SYSLOG_RING_MAX_BYTES:-256MiB}
      SYSLOG_RING_HIGH_WATER: ${SYSLOG_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL ou dreno estourado despeja o
      # backlog em /data/emergency/emg-*.jsonl, um JLH por linha (SPEC §12).
      SYSLOG_EMERGENCY_ENABLED: "true"

      # --- sink: PostgreSQL (o unico; nao ha SYSLOG_SINK_TYPE) ----------------
      # 4 e' o padrao; acima de 16 o boot avisa: cada worker prende uma conexao
      # de um orcamento que a frota inteira divide (SPEC §10.5).
      SYSLOG_SINK_WORKERS: ${SYSLOG_SINK_WORKERS:-4}
      SYSLOG_SINK_POSTGRES_TABLE: ${SYSLOG_SINK_POSTGRES_TABLE:-loghub.inbox}
      # 0 deriva sink.workers + 1 = 5.
      SYSLOG_SINK_POSTGRES_POOL_SIZE: ${SYSLOG_SINK_POSTGRES_POOL_SIZE:-0}
      # Conexao, SEM TLS (sempre sslmode=disable, SPEC §1.2): o banco precisa
      # estar numa rede confiavel -- aqui, a rede interna do compose.
      # Estas quatro sao as chaves "donas" do LOGHUB_EB_URL (SPEC §10.9). Para
      # usar a URL no lugar delas, apague as quatro linhas abaixo e descomente a
      # LOGHUB_EB_URL (README); a URL leva a senha do servico postgres abaixo
      # (postgres://syslog:syslog@postgres:5432/syslog), sem sslmode=require.
      # Usuario e banco sem valor so' entram se definidos no .env ou no shell;
      # sem eles vale o padrao do servidor, syslog/syslog, o mesmo do servico
      # postgres.
      SYSLOG_SINK_POSTGRES_ADDR: postgres:5432
      SYSLOG_SINK_POSTGRES_PASSWORD: ${SYSLOG_SINK_POSTGRES_PASSWORD:-syslog}
      SYSLOG_SINK_POSTGRES_USERNAME:
      SYSLOG_SINK_POSTGRES_DATABASE:
      #LOGHUB_EB_URL: ${LOGHUB_EB_URL:?defina LOGHUB_EB_URL no .env ou no shell}

    ports:
      # SYSLOG_PORT do host na 1514 do container: a imagem nao abre porta privilegiada.
      - "${SYSLOG_PORT:-5180}:1514/udp"
      - "${SYSLOG_PORT:-5180}:1514/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${SYSLOG_ADMIN_PORT:-19180}:9102"

    volumes:
      # UM volume por instancia: a identidade (agent_uuid) e os dumps moram
      # nele, e duas replicas no mesmo volume enfileirariam o mesmo `from`
      # (SPEC §16.6). ./conf (as chaves recarregaveis) vem de common.yml.
      - slpg-data:/data

  postgres:
    image: ${SYSLOG_POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: slpg-postgres
    hostname: slpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SYSLOG_SINK_POSTGRES_USERNAME:-syslog}
      POSTGRES_PASSWORD: ${SYSLOG_SINK_POSTGRES_PASSWORD:-syslog}
      POSTGRES_DB: ${SYSLOG_SINK_POSTGRES_DATABASE:-syslog}
    volumes:
      # A imagem 18 guarda os dados em /var/lib/postgresql/18/docker e recusa
      # um volume montado no antigo /var/lib/postgresql/data.
      - slpg-postgres-data:/var/lib/postgresql
      # O servidor nunca faz DDL (SPEC §10.5): a fila loghub.inbox vem daqui,
      # na criacao do volume (DDL literal da skill, SPEC §3.7.1).
      - ./postgres/inbox.sql:/docker-entrypoint-initdb.d/10-inbox.sql:ro
    ports:
      - "127.0.0.1:${SYSLOG_POSTGRES_PORT:-15480}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYSLOG_SINK_POSTGRES_USERNAME:-syslog} -d ${SYSLOG_SINK_POSTGRES_DATABASE:-syslog}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  slpg-data:
  slpg-postgres-data:
