# ring na RAM  ->  Valkey Streams
#
# Garantia: a mensagem esta' na RAM deste no'. SIGTERM nao perde (dreno);
#   FATAL do sink nao perde (dump de emergencia); SIGKILL e OOM perdem o backlog.
#
# A mesma combinacao de compose.memory-redis.yml, com Valkey no lugar do Redis
# (sink.type=valkey e o alias de redis; docs/SPEC.md 10.3).
#
#   docker compose -f compose.memory-valkey.yml up -d --build
#
# Publicado no host: syslog 5158/udp e 5158/tcp, RELP 20618/tcp, admin
# 127.0.0.1:19118. Defaults distintos por combinacao para que varias rodem lado
# a lado; SYSLOG_PORT, SYSLOG_RELP_PORT e SYSLOG_ADMIN_PORT fixam.

name: slstd-memory-valkey

services:
  syslog:
    extends:
      file: common.yml
      service: slstd-base
    container_name: slstd-memory-valkey
    depends_on:
      valkey:
        condition: service_healthy

    environment:
      SYSLOG_NODE_ID: slstd-memory-valkey

      # --- ring: memory ---------------------------------------------------------
      SYSLOG_RING_MODE: memory
      # Tetos do ring. Estourar qualquer um dos dois aplica o backpressure de cada
      # transporte (docs/SPEC.md 2.3): o TCP para de ler, o RELP responde 500, o
      # UDP descarta e conta. Nunca "aceito e descartado".
      SYSLOG_RING_CAPACITY_ITEMS: ${SYSLOG_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): com ring=memory o teto de
      # bytes do ring fica todo na RAM e o boot avisa se GOMEMLIMIT for menor que
      # o dobro dele. Quem subir um, suba o outro junto (SYSLOG_GOMEMLIMIT e
      # SYSLOG_MEMORY_LIMIT).
      SYSLOG_RING_MAX_BYTES: ${SYSLOG_RING_MAX_BYTES:-256MiB}
      SYSLOG_RING_HIGH_WATER: ${SYSLOG_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL despeja o backlog em
      # /data/emergency e reingere no boot seguinte. E' a escrita em disco que
      # obriga o volume mesmo nesta combinacao.
      SYSLOG_EMERGENCY_ENABLED: "true"

      # --- sink: valkey (= redis, SPEC 10.3) ------------------------------------------------
      SYSLOG_SINK_TYPE: valkey
      SYSLOG_SINK_VALKEY_ADDRS: valkey:6379
      # Stream proprio, separado do webhooks:in: volume, retencao e consumidores
      # diferentes (docs/SPEC.md 3.3).
      SYSLOG_SINK_VALKEY_STREAM: ${SYSLOG_SINK_VALKEY_STREAM:-syslog:in}
      SYSLOG_SINK_VALKEY_DB: ${SYSLOG_SINK_VALKEY_DB:-0}
      SYSLOG_SINK_VALKEY_USERNAME: ${SYSLOG_SINK_VALKEY_USERNAME:-}
      SYSLOG_SINK_VALKEY_PASSWORD: ${SYSLOG_SINK_VALKEY_PASSWORD:-}
      # 0 desliga o trim. MAXLEN descartaria mensagens antigas em silencio.
      SYSLOG_SINK_VALKEY_MAXLEN: ${SYSLOG_SINK_VALKEY_MAXLEN:-0}
      SYSLOG_SINK_WORKERS: ${SYSLOG_SINK_WORKERS:-8}
      SYSLOG_SINK_BATCH: ${SYSLOG_SINK_BATCH:-256}

    ports:
      # 514 do host na 1514 do container: a imagem nao abre porta privilegiada.
      - "${SYSLOG_PORT:-5158}:1514/udp"
      - "${SYSLOG_PORT:-5158}:1514/tcp"
      - "${SYSLOG_RELP_PORT:-20618}:20514/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${SYSLOG_ADMIN_PORT:-19118}:9102"

    volumes:
      - slstd-data:/data

  valkey:
    # valkey-server como primeiro argumento: e' o que faz o entrypoint da
    # imagem oficial rebaixar o privilegio para o usuario valkey e ajustar o
    # /data. Pelo symlink com o nome antigo o processo rodaria como root.
    image: ${SYSLOG_VALKEY_IMAGE:-valkey/valkey:8.1-alpine}
    container_name: slstd-memory-valkey-valkey
    restart: unless-stopped
    command:
      # AOF com fsync a cada segundo: perde no maximo 1s de stream num crash.
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - slstd-valkey-data:/data
    ports:
      - "127.0.0.1:${SYSLOG_VALKEY_PORT:-16320}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  slstd-data:
  slstd-valkey-data:
