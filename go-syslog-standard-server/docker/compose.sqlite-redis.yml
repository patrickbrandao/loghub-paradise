# ring persistente em SQLite  ->  Redis Streams
#
# Garantia: COMMIT em disco antes da confirmacao. So' faz sentido com TCP e
#   RELP: no UDP o fsync garante o que a rede talvez ja' tenha descartado.
#
#   docker compose -f compose.sqlite-redis.yml up -d --build
#
# Publicado no host: syslog 5144/udp e 5144/tcp, RELP 20604/tcp, admin
# 127.0.0.1:19104. Defaults distintos por combinacao para que varias rodem lado
# a lado; SYSLOG_PORT, SYSLOG_RELP_PORT e SYSLOG_ADMIN_PORT fixam.

name: sls-sqlite-redis

services:
  syslog:
    extends:
      file: common.yml
      service: sls-base
    container_name: sls-sqlite-redis
    depends_on:
      redis:
        condition: service_healthy

    environment:
      SYSLOG_NODE_ID: sls-sqlite-redis

      # --- ring: sqlite ---------------------------------------------------------
      SYSLOG_RING_MODE: sqlite
      # FULL faz fsync a cada group commit: sobrevive a queda de energia, e a
      # latencia de confirmacao fica presa ao disco.
      SYSLOG_RING_SQLITE_SYNCHRONOUS: ${SYSLOG_RING_SQLITE_SYNCHRONOUS:-FULL}
      SYSLOG_RING_CAPACITY_ITEMS: ${SYSLOG_RING_CAPACITY_ITEMS:-65536}
      SYSLOG_RING_MAX_BYTES: ${SYSLOG_RING_MAX_BYTES:-512MiB}
      # Sem efeito com ring=sqlite: os itens ja' estao em disco.
      SYSLOG_EMERGENCY_ENABLED: "false"

      # --- sink: redis ---------------------------------------------------------
      SYSLOG_SINK_TYPE: redis
      SYSLOG_SINK_REDIS_ADDRS: redis:6379
      # Stream proprio, separado do webhooks:in: volume, retencao e consumidores
      # diferentes (docs/SPEC.md 3.3).
      SYSLOG_SINK_REDIS_STREAM: ${SYSLOG_SINK_REDIS_STREAM:-syslog:in}
      SYSLOG_SINK_REDIS_DB: ${SYSLOG_SINK_REDIS_DB:-0}
      SYSLOG_SINK_REDIS_USERNAME: ${SYSLOG_SINK_REDIS_USERNAME:-}
      SYSLOG_SINK_REDIS_PASSWORD: ${SYSLOG_SINK_REDIS_PASSWORD:-}
      # 0 desliga o trim. MAXLEN descartaria mensagens antigas em silencio.
      SYSLOG_SINK_REDIS_MAXLEN: ${SYSLOG_SINK_REDIS_MAXLEN:-0}
      SYSLOG_SINK_WORKERS: ${SYSLOG_SINK_WORKERS:-8}
      SYSLOG_SINK_BATCH: ${SYSLOG_SINK_BATCH:-256}

    ports:
      # 514 do host na 1514 do container: a imagem nao abre porta privilegiada.
      - "${SYSLOG_PORT:-5144}:1514/udp"
      - "${SYSLOG_PORT:-5144}:1514/tcp"
      - "${SYSLOG_RELP_PORT:-20604}:20514/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${SYSLOG_ADMIN_PORT:-19104}:9102"

    volumes:
      - sls-data:/data

  redis:
    image: ${SYSLOG_REDIS_IMAGE:-redis:7.4-alpine}
    container_name: sls-sqlite-redis-redis
    restart: unless-stopped
    command:
      # AOF com fsync a cada segundo: perde no maximo 1s de stream num crash.
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${SYSLOG_REDIS_PORT:-16304}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  sls-data:
  redis-data:
