# nats-server dos compose.*-nats.yml.
#
# max_payload conta headers e dados de cada mensagem. O padrao do nats-server e'
# 1 MiB, e o syslog recusa o boot com codigo 3 quando o maior evento que ele pode
# aceitar nao cabe (docs/SPEC.md 3.9, 10.8.5): confirmar uma mensagem por RELP e
# descobrir na publicacao que ela nao cabe seria descartar mensagem confirmada.
#
# O maior evento e' a linha crua mais o envelope no pior caso -- sete vezes o
# teto de frame. Por isso os compose de NATS baixam tcp.max_frame_bytes e
# relp.max_frame_bytes para 1 MiB (7 MiB de evento) e este arquivo sobe
# max_payload para 8 MB. Quem subir os frames sobe isto junto.
#
# O stream SYSLOG NAO e' criado pelo syslog: o servico nats-init dos compose o
# cria a partir de stream.json, e o syslog so' valida no boot.
port: 4222
http_port: 8222
max_payload: 8MB

jetstream {
  store_dir: /data
}
