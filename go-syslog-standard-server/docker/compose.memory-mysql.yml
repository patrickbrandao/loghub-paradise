# ring na RAM  ->  MySQL (destino compartilhado)
#
# Garantia: a mensagem esta' na RAM deste no'. SIGTERM nao perde (dreno);
#   FATAL do sink nao perde (dump de emergencia); SIGKILL e OOM perdem o backlog.
#
# O servidor NUNCA cria a tabela (docs/SPEC.md 10.7): a imagem oficial do MySQL
# executa ./mysql/schema.sql uma vez, na criacao do volume, e o syslog valida no
# boot o motor, as colunas, o indice unico, o INSERT e o UPDATE (sonda numa
# transacao revertida) e o max_allowed_packet -- e sai com codigo 3 na hora se
# algo faltar.
#
#   docker compose -f compose.memory-mysql.yml up -d --build
#
# Publicado no host: syslog 5152/udp e 5152/tcp, RELP 20612/tcp, admin
# 127.0.0.1:19112. Defaults distintos por combinacao para que varias rodem lado
# a lado; SYSLOG_PORT, SYSLOG_RELP_PORT e SYSLOG_ADMIN_PORT fixam.

name: sls-memory-mysql

services:
  syslog:
    extends:
      file: common.yml
      service: sls-base
    container_name: sls-memory-mysql
    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SYSLOG_NODE_ID: sls-memory-mysql

      # --- ring: memory ---------------------------------------------------------
      SYSLOG_RING_MODE: memory
      # Tetos do ring. Estourar qualquer um dos dois aplica o backpressure de cada
      # transporte (docs/SPEC.md 2.3): o TCP para de ler, o RELP responde 500, o
      # UDP descarta e conta. Nunca "aceito e descartado".
      SYSLOG_RING_CAPACITY_ITEMS: ${SYSLOG_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): com ring=memory o teto de
      # bytes do ring fica todo na RAM e o boot avisa se GOMEMLIMIT for menor que
      # o dobro dele. Quem subir um, suba o outro junto (SYSLOG_GOMEMLIMIT e
      # SYSLOG_MEMORY_LIMIT).
      SYSLOG_RING_MAX_BYTES: ${SYSLOG_RING_MAX_BYTES:-256MiB}
      SYSLOG_RING_HIGH_WATER: ${SYSLOG_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL despeja o backlog em
      # /data/emergency e reingere no boot seguinte. E' a escrita em disco que
      # obriga o volume mesmo nesta combinacao.
      SYSLOG_EMERGENCY_ENABLED: "true"

      # --- sink: mysql ----------------------------------------------------------
      SYSLOG_SINK_TYPE: mysql
      SYSLOG_SINK_MYSQL_ADDR: mysql:3306
      SYSLOG_SINK_MYSQL_USERNAME: ${SYSLOG_SINK_MYSQL_USERNAME:-syslog}
      SYSLOG_SINK_MYSQL_PASSWORD: ${SYSLOG_SINK_MYSQL_PASSWORD:-syslog}
      SYSLOG_SINK_MYSQL_DATABASE: ${SYSLOG_SINK_MYSQL_DATABASE:-syslog}
      SYSLOG_SINK_MYSQL_TABLE: ${SYSLOG_SINK_MYSQL_TABLE:-events}
      SYSLOG_SINK_MYSQL_POOL_SIZE: ${SYSLOG_SINK_MYSQL_POOL_SIZE:-0}
      # Rede interna do compose: sem TLS. Contra um banco gerenciado, ligue
      # SYSLOG_SINK_MYSQL_TLS e monte a CA em /etc/syslog (somente leitura).
      SYSLOG_SINK_MYSQL_TLS: ${SYSLOG_SINK_MYSQL_TLS:-false}

    ports:
      # 514 do host na 1514 do container: a imagem nao abre porta privilegiada.
      - "${SYSLOG_PORT:-5152}:1514/udp"
      - "${SYSLOG_PORT:-5152}:1514/tcp"
      - "${SYSLOG_RELP_PORT:-20612}:20514/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${SYSLOG_ADMIN_PORT:-19112}:9102"

    volumes:
      - sls-data:/data

  mysql:
    image: ${SYSLOG_MYSQL_IMAGE:-mysql:8.4}
    container_name: sls-memory-mysql-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SYSLOG_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${SYSLOG_SINK_MYSQL_DATABASE:-syslog}
      # A imagem concede ALL em MYSQL_DATABASE.* a este usuario, o que cobre o
      # INSERT e o UPDATE que o ON DUPLICATE KEY exige (docs/SPEC.md 10.7.4).
      MYSQL_USER: ${SYSLOG_SINK_MYSQL_USERNAME:-syslog}
      MYSQL_PASSWORD: ${SYSLOG_SINK_MYSQL_PASSWORD:-syslog}
    command:
      - mysqld
      # O que "INSERT confirmado" significa mora nesta linha (docs/SPEC.md
      # 10.7.5): com 1, o INSERT so' retorna depois do fsync do redo log. O
      # syslog nao le nem altera este valor.
      - --innodb_flush_log_at_trx_commit=1
      # A maior linha que o syslog pode aceitar com os frames padrao de 16 MiB
      # passa de 160 MiB (linha crua, envelope no pior caso e colunas de texto),
      # e 7/8 do pacote precisa comporta-la, ou o boot sai com codigo 3
      # (docs/SPEC.md 3.9, 10.7.4). Quem baixar SYSLOG_TCP_MAX_FRAME_BYTES pode
      # baixar isto junto.
      - --max_allowed_packet=256M
    volumes:
      - mysql-data:/var/lib/mysql
      # Executado UMA vez pela imagem oficial, ao criar o volume, dentro de
      # MYSQL_DATABASE. Depois disso o esquema e' seu.
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      - "127.0.0.1:${SYSLOG_MYSQL_PORT:-13312}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  sls-data:
  mysql-data:
