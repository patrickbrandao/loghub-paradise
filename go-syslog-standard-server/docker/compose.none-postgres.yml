# sem ring  ->  PostgreSQL (destino compartilhado)
#
# Garantia: o receptor escreve no destino e so' confirma depois. E' o modo
#   lento por definicao, e o unico em que o parse completo roda na recepcao.
#
# ATENCAO: a durabilidade da confirmacao e' a do servidor PostgreSQL: com
#   synchronous_commit=off ela sai antes de o WAL estar em disco.
#
#   docker compose -f compose.none-postgres.yml up -d --build
#
# Publicado no host: syslog 5150/udp e 5150/tcp, RELP 20610/tcp, admin
# 127.0.0.1:19110. Defaults distintos por combinacao para que varias rodem lado
# a lado; SYSLOG_PORT, SYSLOG_RELP_PORT e SYSLOG_ADMIN_PORT fixam.

name: sls-none-postgres

services:
  syslog:
    extends:
      file: common.yml
      service: sls-base
    container_name: sls-none-postgres
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SYSLOG_NODE_ID: sls-none-postgres

      # --- ring: none ---------------------------------------------------------
      SYSLOG_RING_MODE: none
      # Escritas sincronas simultaneas. Cheio, vale o mesmo backpressure dos outros
      # modos.
      SYSLOG_RING_MAX_INFLIGHT: ${SYSLOG_RING_MAX_INFLIGHT:-2048}
      SYSLOG_EMERGENCY_ENABLED: "false"

      # --- sink: postgres ---------------------------------------------------------
      SYSLOG_SINK_TYPE: postgres
      SYSLOG_SINK_POSTGRES_ADDR: postgres:5432
      SYSLOG_SINK_POSTGRES_USERNAME: ${SYSLOG_SINK_POSTGRES_USERNAME:-syslog}
      SYSLOG_SINK_POSTGRES_PASSWORD: ${SYSLOG_SINK_POSTGRES_PASSWORD:-syslog}
      SYSLOG_SINK_POSTGRES_DATABASE: ${SYSLOG_SINK_POSTGRES_DATABASE:-syslog}
      SYSLOG_SINK_POSTGRES_TABLE: ${SYSLOG_SINK_POSTGRES_TABLE:-events}
      SYSLOG_SINK_POSTGRES_POOL_SIZE: ${SYSLOG_SINK_POSTGRES_POOL_SIZE:-0}

    ports:
      # 514 do host na 1514 do container: a imagem nao abre porta privilegiada.
      - "${SYSLOG_PORT:-5150}:1514/udp"
      - "${SYSLOG_PORT:-5150}:1514/tcp"
      - "${SYSLOG_RELP_PORT:-20610}:20514/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${SYSLOG_ADMIN_PORT:-19110}:9102"

    volumes:
      - sls-data:/data

  postgres:
    # 17 fixado: a imagem 18 mudou o diretorio de dados que este volume monta.
    image: ${SYSLOG_POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: sls-none-postgres-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SYSLOG_SINK_POSTGRES_USERNAME:-syslog}
      POSTGRES_PASSWORD: ${SYSLOG_SINK_POSTGRES_PASSWORD:-syslog}
      POSTGRES_DB: ${SYSLOG_SINK_POSTGRES_DATABASE:-syslog}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # O servidor NUNCA cria a tabela (docs/SPEC.md 10.5.1). Aqui quem cria e' a
      # imagem oficial, no primeiro boot do volume, a partir do schema canonico.
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      - "127.0.0.1:${SYSLOG_POSTGRES_PORT:-15410}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYSLOG_SINK_POSTGRES_USERNAME:-syslog} -d ${SYSLOG_SINK_POSTGRES_DATABASE:-syslog}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  sls-data:
  postgres-data:
