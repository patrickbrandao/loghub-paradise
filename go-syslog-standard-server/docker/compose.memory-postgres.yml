# ring na RAM  ->  PostgreSQL (destino compartilhado)
#
# Garantia: a mensagem esta' na RAM deste no'. SIGTERM nao perde (dreno);
#   FATAL do sink nao perde (dump de emergencia); SIGKILL e OOM perdem o backlog.
#
#   docker compose -f compose.memory-postgres.yml up -d --build
#
# Publicado no host: syslog 5142/udp e 5142/tcp, RELP 20602/tcp, admin
# 127.0.0.1:19102. Defaults distintos por combinacao para que varias rodem lado
# a lado; SYSLOG_PORT, SYSLOG_RELP_PORT e SYSLOG_ADMIN_PORT fixam.

name: sls-memory-postgres

services:
  syslog:
    extends:
      file: common.yml
      service: sls-base
    container_name: sls-memory-postgres
    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SYSLOG_NODE_ID: sls-memory-postgres

      # --- ring: memory ---------------------------------------------------------
      SYSLOG_RING_MODE: memory
      # Tetos do ring. Estourar qualquer um dos dois aplica o backpressure de cada
      # transporte (docs/SPEC.md 2.3): o TCP para de ler, o RELP responde 500, o
      # UDP descarta e conta. Nunca "aceito e descartado".
      SYSLOG_RING_CAPACITY_ITEMS: ${SYSLOG_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): com ring=memory o teto de
      # bytes do ring fica todo na RAM e o boot avisa se GOMEMLIMIT for menor que
      # o dobro dele. Quem subir um, suba o outro junto (SYSLOG_GOMEMLIMIT e
      # SYSLOG_MEMORY_LIMIT).
      SYSLOG_RING_MAX_BYTES: ${SYSLOG_RING_MAX_BYTES:-256MiB}
      SYSLOG_RING_HIGH_WATER: ${SYSLOG_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL despeja o backlog em
      # /data/emergency e reingere no boot seguinte. E' a escrita em disco que
      # obriga o volume mesmo nesta combinacao.
      SYSLOG_EMERGENCY_ENABLED: "true"

      # --- sink: postgres ---------------------------------------------------------
      SYSLOG_SINK_TYPE: postgres
      SYSLOG_SINK_POSTGRES_ADDR: postgres:5432
      SYSLOG_SINK_POSTGRES_USERNAME: ${SYSLOG_SINK_POSTGRES_USERNAME:-syslog}
      SYSLOG_SINK_POSTGRES_PASSWORD: ${SYSLOG_SINK_POSTGRES_PASSWORD:-syslog}
      SYSLOG_SINK_POSTGRES_DATABASE: ${SYSLOG_SINK_POSTGRES_DATABASE:-syslog}
      SYSLOG_SINK_POSTGRES_TABLE: ${SYSLOG_SINK_POSTGRES_TABLE:-events}
      SYSLOG_SINK_POSTGRES_POOL_SIZE: ${SYSLOG_SINK_POSTGRES_POOL_SIZE:-0}

    ports:
      # 514 do host na 1514 do container: a imagem nao abre porta privilegiada.
      - "${SYSLOG_PORT:-5142}:1514/udp"
      - "${SYSLOG_PORT:-5142}:1514/tcp"
      - "${SYSLOG_RELP_PORT:-20602}:20514/tcp"
      # Admin so' no loopback do host: /metrics e /readyz nunca ficam expostos.
      - "127.0.0.1:${SYSLOG_ADMIN_PORT:-19102}:9102"

    volumes:
      - sls-data:/data

  postgres:
    # 17 fixado: a imagem 18 mudou o diretorio de dados que este volume monta.
    image: ${SYSLOG_POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: sls-memory-postgres-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SYSLOG_SINK_POSTGRES_USERNAME:-syslog}
      POSTGRES_PASSWORD: ${SYSLOG_SINK_POSTGRES_PASSWORD:-syslog}
      POSTGRES_DB: ${SYSLOG_SINK_POSTGRES_DATABASE:-syslog}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # O servidor NUNCA cria a tabela (docs/SPEC.md 10.5.1). Aqui quem cria e' a
      # imagem oficial, no primeiro boot do volume, a partir do schema canonico.
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    ports:
      - "127.0.0.1:${SYSLOG_POSTGRES_PORT:-15402}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SYSLOG_SINK_POSTGRES_USERNAME:-syslog} -d ${SYSLOG_SINK_POSTGRES_DATABASE:-syslog}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  sls-data:
  postgres-data:
