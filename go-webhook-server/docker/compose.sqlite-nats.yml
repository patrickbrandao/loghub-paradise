# ring duravel em disco  ->  publicacao num stream JetStream (NATS)
#
# Retencao local maxima com um stream como destino: o 200 so' sai depois do
# COMMIT com fsync no ring.db, entao uma queda abrupta do processo nao perde
# nada -- o backlog e' drenado no boot seguinte, antes de a porta publica
# abrir. O dreno publica em lote com PubAck por mensagem e Nats-Msg-Id.
#
# E' a combinacao para quando o NATS pode ficar indisponivel por longos
# periodos e nada pode ser perdido nem recusado nesse intervalo: a fila local
# absorve. O stream e' criado por nats-init a partir de ./nats/stream.json e
# so' validado pelo webhook no boot (docs/SPEC.md 8.7.5).
#
#   docker compose -f compose.sqlite-nats.yml up -d --build

name: whs-sqlite-nats

services:
  webhook:
    extends:
      file: common.yml
      service: whs-base
    container_name: whs-sqlite-nats
    # O HOSTNAME do go-loghub-ident (SPEC §3.5): sem ele seria o id do
    # container, que muda a cada recriacao.
    hostname: whs-sqlite-nats

    depends_on:
      nats:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully

    environment:

      # --- ring: sqlite -----------------------------------------------------
      WHS_RING_MODE: sqlite
      # Vazio deriva <data_dir>/ring.db; explicito para deixar obvio o que
      # precisa estar no volume.
      WHS_RING_SQLITE_PATH: /data/ring.db
      # FULL sobrevive a queda de energia e amarra o p99 ao disco.
      WHS_RING_SQLITE_SYNCHRONOUS: ${WHS_RING_SQLITE_SYNCHRONOUS:-FULL}
      WHS_RING_SQLITE_COMMIT_BATCH: ${WHS_RING_SQLITE_COMMIT_BATCH:-256}
      WHS_RING_SQLITE_COMMIT_MAX_DELAY: ${WHS_RING_SQLITE_COMMIT_MAX_DELAY:-5ms}
      WHS_RING_CAPACITY_ITEMS: ${WHS_RING_CAPACITY_ITEMS:-65536}
      WHS_RING_MAX_BYTES: ${WHS_RING_MAX_BYTES:-512MiB}
      WHS_RING_HIGH_WATER: ${WHS_RING_HIGH_WATER:-0.80}
      # Sem efeito com ring=sqlite: os itens ja' estao em disco.
      WHS_EMERGENCY_ENABLED: "false"

      # --- sink: nats -------------------------------------------------------
      WHS_SINK_TYPE: nats
      WHS_SINK_NATS_URLS: nats://nats:4222
      # Se trocar o nome do stream, troque tambem os subjects em ./nats/stream.json.
      WHS_SINK_NATS_STREAM: ${WHS_SINK_NATS_STREAM:-LOGHUB_WEBHOOK_REQUEST}
      WHS_SINK_NATS_SUBJECT: ${WHS_SINK_NATS_SUBJECT:-loghub.{space}.{type}}
      # Rede interna do compose: sem autenticacao nem TLS. Contra um NATS
      # gerenciado, monte um arquivo .creds em /etc/webhook (somente leitura) e
      # aponte WHS_SINK_NATS_CREDENTIALS para ele; ligue WHS_SINK_NATS_TLS.
      WHS_SINK_NATS_USERNAME: ${WHS_SINK_NATS_USERNAME:-}
      WHS_SINK_NATS_PASSWORD: ${WHS_SINK_NATS_PASSWORD:-}
      WHS_SINK_NATS_TOKEN: ${WHS_SINK_NATS_TOKEN:-}
      WHS_SINK_NATS_CREDENTIALS: ${WHS_SINK_NATS_CREDENTIALS:-}
      WHS_SINK_NATS_TLS: ${WHS_SINK_NATS_TLS:-false}
      WHS_SINK_NATS_TLS_CA: ${WHS_SINK_NATS_TLS_CA:-}

      # Uma conexao multiplexada por todos os workers: varios valem a pena,
      # como no Redis.
      WHS_SINK_WORKERS: ${WHS_SINK_WORKERS:-8}
      WHS_SINK_BATCH: ${WHS_SINK_BATCH:-256}
      WHS_SINK_BATCH_MAX_BYTES: ${WHS_SINK_BATCH_MAX_BYTES:-16MiB}
      WHS_SINK_BATCH_MAX_DELAY: ${WHS_SINK_BATCH_MAX_DELAY:-5ms}
      WHS_SINK_OP_TIMEOUT: ${WHS_SINK_OP_TIMEOUT:-5s}

    ports:
      - "${WHS_HTTP_PORT:-8093}:8080"
      - "127.0.0.1:${WHS_ADMIN_PORT:-9123}:9101"

    # /data guarda o ring.db, a fonte da verdade desta combinacao.
    volumes:
      - whs-data:/data

  nats:
    image: ${WHS_NATS_IMAGE:-nats:2.11-alpine}
    container_name: whs-sqlite-nats-nats
    restart: unless-stopped
    # A imagem oficial ja' roda `nats-server --config /etc/nats/nats-server.conf`;
    # o arquivo montado por cima liga o JetStream em /data e sobe max_payload
    # para 8 MB (ver ./nats/nats-server.conf).
    volumes:
      - nats-data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    ports:
      - "127.0.0.1:${WHS_NATS_PORT:-4223}:4222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Cria o stream UMA vez, de forma idempotente: `stream info` responde se ele
  # ja' existe; senao `stream add` o cria a partir do arquivo canonico. Contra
  # um NATS de producao esse papel e' de quem administra o servidor -- o
  # webhook nunca cria nem altera um stream (docs/SPEC.md 8.7.5).
  nats-init:
    image: ${WHS_NATS_BOX_IMAGE:-natsio/nats-box:0.20.0}
    container_name: whs-sqlite-nats-init
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./nats/stream.json:/etc/nats/stream.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        nats --server nats://nats:4222 stream info ${WHS_SINK_NATS_STREAM:-LOGHUB_WEBHOOK_REQUEST} >/dev/null 2>&1
        || nats --server nats://nats:4222 stream add ${WHS_SINK_NATS_STREAM:-LOGHUB_WEBHOOK_REQUEST} --config /etc/nats/stream.json
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whs-data:
  nats-data:
