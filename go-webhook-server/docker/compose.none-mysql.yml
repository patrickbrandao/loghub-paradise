# sem ring (escrita sincrona)  ->  MySQL
#
# Modo sem buffer: o handler faz o INSERT e so' entao responde. Um 200 aqui
# significa "o servidor de banco confirmou o commit" -- e o que "confirmou"
# vale e' o innodb_flush_log_at_trx_commit DELE (docs/SPEC.md 8.6.5, 16.1).
# E' uma das linhas da matriz cuja durabilidade depende de configuracao fora
# do processo; por isso o valor fica explicito abaixo, no servico mysql.
#
# Como no PostgreSQL, nao ha' coalescencia: cada requisicao ocupa uma conexao
# do pool durante o seu INSERT, e a vazao fica presa a
# pool_size / latencia de commit. ring.max_inflight acima do pool nao amplia
# nada -- o excedente espera conexao DENTRO do pool, fora da contabilidade do
# ring (SPEC 7.5). Os dois valores abaixo andam juntos por isso.
#
#   docker compose -f compose.none-mysql.yml up -d --build

name: whs-none-mysql

services:
  webhook:
    extends:
      file: common.yml
      service: whs-base
    container_name: whs-none-mysql
    # O HOSTNAME do go-loghub-ident (SPEC §3.5): sem ele seria o id do
    # container, que muda a cada recriacao.
    hostname: whs-none-mysql

    depends_on:
      mysql:
        condition: service_healthy

    environment:

      # --- ring: none -------------------------------------------------------
      WHS_RING_MODE: none
      # Casado com o pool: cada escrita em voo e' uma conexao. Subir so' este
      # valor cria uma fila escondida dentro do pool e o boot avisa.
      WHS_RING_MAX_INFLIGHT: ${WHS_RING_MAX_INFLIGHT:-32}
      # capacity_items / max_bytes / high_water nao se aplicam: nao ha' fila.
      WHS_EMERGENCY_ENABLED: "false"

      # --- sink: mysql ------------------------------------------------------
      WHS_SINK_TYPE: mysql
      WHS_SINK_MYSQL_ADDR: mysql:3306
      WHS_SINK_MYSQL_USERNAME: ${WHS_SINK_MYSQL_USERNAME:-webhook}
      # A senha padrao serve ao ambiente de desenvolvimento. Em producao, .env.
      WHS_SINK_MYSQL_PASSWORD: ${WHS_SINK_MYSQL_PASSWORD:-webhook}
      WHS_SINK_MYSQL_DATABASE: ${WHS_SINK_MYSQL_DATABASE:-webhook}
      WHS_SINK_MYSQL_TABLE: ${WHS_SINK_MYSQL_TABLE:-inbox}
      # Explicito e igual ao max_inflight: quem escreve e' o handler, nao os
      # workers, entao o "workers + 1" derivado nao faria sentido aqui.
      WHS_SINK_MYSQL_POOL_SIZE: ${WHS_SINK_MYSQL_POOL_SIZE:-32}
      # Rede interna do compose: sem TLS. Contra um banco gerenciado, ligue
      # WHS_SINK_MYSQL_TLS e monte a CA em /etc/webhook (somente leitura).
      WHS_SINK_MYSQL_TLS: ${WHS_SINK_MYSQL_TLS:-false}
      WHS_SINK_MYSQL_TLS_CA: ${WHS_SINK_MYSQL_TLS_CA:-}
      # Nao ha' dreno em background neste modo: workers/batch ficam sem efeito
      # sobre o caminho da requisicao.
      WHS_SINK_OP_TIMEOUT: ${WHS_SINK_OP_TIMEOUT:-5s}

    ports:
      - "${WHS_HTTP_PORT:-8097}:8080"
      - "127.0.0.1:${WHS_ADMIN_PORT:-9127}:9101"

    volumes:
      - whs-data:/data

  mysql:
    image: ${WHS_MYSQL_IMAGE:-mysql:8.4}
    container_name: whs-none-mysql-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WHS_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${WHS_SINK_MYSQL_DATABASE:-webhook}
      MYSQL_USER: ${WHS_SINK_MYSQL_USERNAME:-webhook}
      MYSQL_PASSWORD: ${WHS_SINK_MYSQL_PASSWORD:-webhook}
    command:
      - mysqld
      # A garantia do 200 desta combinacao mora nesta linha (SPEC 8.6.5): com 1,
      # o INSERT so' retorna depois do fsync do redo log. O webhook nao le nem
      # altera este valor.
      - --innodb_flush_log_at_trx_commit=1
      # Corpo maximo (5 MiB) mais envelope precisa caber num pacote, e o boot
      # confere (SPEC 8.6.4). O padrao do 8.x ja' e' 64M; explicito para nao
      # depender da versao.
      - --max_allowed_packet=64M
    volumes:
      - mysql-data:/var/lib/mysql
      # Executado UMA vez pela imagem oficial, ao criar o volume, dentro de
      # MYSQL_DATABASE. Depois disso o esquema e' seu: migre com a ferramenta
      # que administrar o banco.
      - ./mysql/inbox.sql:/docker-entrypoint-initdb.d/001-inbox.sql:ro
    ports:
      - "127.0.0.1:${WHS_MYSQL_PORT:-3308}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whs-data:
  mysql-data:
