# nats-server dos compose.*-nats.yml.
#
# max_payload conta headers e corpo de cada mensagem. O padrao do nats-server
# e' 1 MiB, abaixo dos 5 MiB de server.max_body_bytes: o webhook recusaria o
# boot com codigo 3 (docs/SPEC.md 8.7.5), porque aceitar um corpo que depois
# nao cabe no stream seria descartar evento ja' confirmado. 8 MB cobre o corpo
# maximo mais o envelope. Quem subir server.max_body_bytes sobe isto junto.
#
# O stream LOGHUB_WEBHOOK_REQUEST NAO e' criado pelo webhook: o servico nats-init dos compose
# o cria a partir de stream.json, e o webhook so' valida no boot.
port: 4222
http_port: 8222
max_payload: 8MB

jetstream {
  store_dir: /data
}
