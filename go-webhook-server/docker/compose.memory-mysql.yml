# ring na RAM  ->  descarga no MySQL
#
# Mesma forma da combinacao de referencia (memory-redis), com um banco
# relacional compartilhado por todas as instancias como destino final. Aceitar
# o evento custa uma copia em memoria; o dreno insere em lotes, uma linha por
# evento, com ON DUPLICATE KEY UPDATE uuid = uuid para que uma redelivery nunca
# duplique -- e nunca INSERT IGNORE, que truncaria dados em silencio.
#
# O servidor NUNCA cria a tabela (docs/SPEC.md 8.5.1, 8.6). A imagem oficial do
# MySQL executa ./mysql/inbox.sql uma vez, na criacao do volume; o webhook
# valida no boot que a tabela existe em InnoDB com as colunas, o indice unico,
# o INSERT (sonda numa transacao revertida) e um max_allowed_packet que
# comporte o maior evento, e sai com codigo 3 na hora se algo faltar.
#
# Durabilidade: o evento so' existe na RAM ate' o INSERT confirmar, e o que
# "confirmado" significa e' o innodb_flush_log_at_trx_commit DO SERVIDOR
# (SPEC 8.6.5). Fica explicito abaixo. O dump de emergencia cobre o trecho em
# RAM.
#
# Conexoes: cada worker segura uma conexao, e o max_connections do MySQL e'
# dividido por todas as instancias. Por isso o padrao aqui e' 4 workers, nao
# 8 como no Redis (SPEC 8.6.2).
#
#   docker compose -f compose.memory-mysql.yml up -d --build

name: whs-memory-mysql

services:
  webhook:
    extends:
      file: common.yml
      service: whs-base
    container_name: whs-memory-mysql
    # O HOSTNAME do go-loghub-ident (SPEC §3.5): sem ele seria o id do
    # container, que muda a cada recriacao.
    hostname: whs-memory-mysql

    depends_on:
      mysql:
        condition: service_healthy

    environment:

      # --- ring: memoria ----------------------------------------------------
      WHS_RING_MODE: memory
      WHS_RING_CAPACITY_ITEMS: ${WHS_RING_CAPACITY_ITEMS:-65536}
      # Metade do GOMEMLIMIT de common.yml (512MiB): com ring=memory o teto de
      # bytes do ring fica todo na RAM e o boot avisa se GOMEMLIMIT for menor que
      # o dobro dele. Quem subir um, suba o outro junto (WHS_GOMEMLIMIT e
      # WHS_MEMORY_LIMIT).
      WHS_RING_MAX_BYTES: ${WHS_RING_MAX_BYTES:-256MiB}
      WHS_RING_HIGH_WATER: ${WHS_RING_HIGH_WATER:-0.80}
      # Rede de seguranca do ring em RAM: em FATAL, o backlog vai para
      # /data/emergency e volta no boot seguinte.
      WHS_EMERGENCY_ENABLED: "true"

      # --- sink: mysql ------------------------------------------------------
      WHS_SINK_TYPE: mysql
      WHS_SINK_MYSQL_ADDR: mysql:3306
      WHS_SINK_MYSQL_USERNAME: ${WHS_SINK_MYSQL_USERNAME:-webhook}
      # A senha padrao serve ao ambiente de desenvolvimento. Em producao, .env.
      WHS_SINK_MYSQL_PASSWORD: ${WHS_SINK_MYSQL_PASSWORD:-webhook}
      WHS_SINK_MYSQL_DATABASE: ${WHS_SINK_MYSQL_DATABASE:-webhook}
      WHS_SINK_MYSQL_TABLE: ${WHS_SINK_MYSQL_TABLE:-inbox}
      # 0 deriva sink.workers + 1: uma conexao por worker e uma de folga (o health tem a sua, fora do pool).
      WHS_SINK_MYSQL_POOL_SIZE: ${WHS_SINK_MYSQL_POOL_SIZE:-0}
      # Rede interna do compose: sem TLS. Contra um banco gerenciado, ligue
      # WHS_SINK_MYSQL_TLS e monte a CA em /etc/webhook (somente leitura).
      WHS_SINK_MYSQL_TLS: ${WHS_SINK_MYSQL_TLS:-false}

      # Explicito para nao emitir o aviso de padrao rebaixado. Cada worker e'
      # uma conexao no servidor; some as instancias antes de subir isto.
      WHS_SINK_WORKERS: ${WHS_SINK_WORKERS:-4}
      WHS_SINK_BATCH: ${WHS_SINK_BATCH:-256}
      WHS_SINK_BATCH_MAX_DELAY: ${WHS_SINK_BATCH_MAX_DELAY:-5ms}
      WHS_SINK_OP_TIMEOUT: ${WHS_SINK_OP_TIMEOUT:-5s}

    ports:
      - "${WHS_HTTP_PORT:-8095}:8080"
      - "127.0.0.1:${WHS_ADMIN_PORT:-9125}:9101"

    # /data so' para os dumps de emergencia -- e aqui eles sao esperados.
    volumes:
      - whs-data:/data

  mysql:
    image: ${WHS_MYSQL_IMAGE:-mysql:8.4}
    container_name: whs-memory-mysql-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WHS_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${WHS_SINK_MYSQL_DATABASE:-webhook}
      MYSQL_USER: ${WHS_SINK_MYSQL_USERNAME:-webhook}
      MYSQL_PASSWORD: ${WHS_SINK_MYSQL_PASSWORD:-webhook}
    command:
      - mysqld
      # A garantia do 200 desta combinacao mora nesta linha (SPEC 8.6.5): com 1,
      # o INSERT so' retorna depois do fsync do redo log. O webhook nao le nem
      # altera este valor.
      - --innodb_flush_log_at_trx_commit=1
      # Corpo maximo (5 MiB) mais envelope precisa caber num pacote, e o boot
      # confere (SPEC 8.6.4). O padrao do 8.x ja' e' 64M; explicito para nao
      # depender da versao.
      - --max_allowed_packet=64M
    volumes:
      - mysql-data:/var/lib/mysql
      # Executado UMA vez pela imagem oficial, ao criar o volume, dentro de
      # MYSQL_DATABASE. Depois disso o esquema e' seu: migre com a ferramenta
      # que administrar o banco.
      - ./mysql/inbox.sql:/docker-entrypoint-initdb.d/001-inbox.sql:ro
    ports:
      - "127.0.0.1:${WHS_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whs-data:
  mysql-data:
